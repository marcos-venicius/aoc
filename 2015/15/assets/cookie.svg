    <line x1="100" y1="280.0" x2="620" y2="280.0" stroke="#21262d"/>
    <text x="90" y="284.0" font-size="12" fill="#8b949e" text-anchor="end">30M</text>
    <line x1="100" y1="240.0" x2="620" y2="240.0" stroke="#21262d"/>
    <text x="90" y="244.0" font-size="12" fill="#8b949e" text-anchor="end">40M</text>
    <line x1="100" y1="200.0" x2="620" y2="200.0" stroke="#21262d"/>
    <text x="90" y="204.0" font-size="12" fill="#8b949e" text-anchor="end">50M</text>
    <line x1="100" y1="160.0" x2="620" y2="160.0" stroke="#21262d"/>
    <text x="90" y="164.0" font-size="12" fill="#8b949e" text-anchor="end">60M</text>
    <line x1="100" y1="120.0" x2="620" y2="120.0" stroke="#21262d"/>
    <text x="90" y="124.0" font-size="12" fill="#8b949e" text-anchor="end">70M</text>
