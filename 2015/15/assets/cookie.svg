<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d">
  <title id="t">Cookie score for every split of 100 teaspoons in the example</title>
  <desc id="d">With Butterscotch and Cinnamon, the score is plotted for 0 to 100 teaspoons of Butterscotch. The best score is 62842880 at 44 teaspoons. Among the recipes with exactly 500 calories, only 40 teaspoons qualifies, scoring 57600000.</desc>
  <rect x="1" y="1" width="958" height="468" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
