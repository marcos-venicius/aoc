    <text x="112" y="150" font-size="13" fill="#d2a8ff">40 → 57,600,000</text>
    <text x="112" y="168" font-size="12" fill="#d2a8ff">(500 calories)</text>
    <text x="360" y="442" font-size="12" fill="#8b949e" text-anchor="middle">teaspoons of Butterscotch (Cinnamon = 100 − x)</text>
    <line x1="656" y1="110" x2="656" y2="440" stroke="#21262d" stroke-width="2"/>
    <text x="680" y="140" font-size="15" font-weight="700" fill="#f2cc60">Best: 44 B + 56 C</text>
    <g font-size="13" fill="#e6edf3">
      <text x="680" y="170">capacity</text><text x="920" y="170" text-anchor="end">-44 +112 = <tspan fill="#3fb950">68</tspan></text>
      <text x="680" y="196">durability</text><text x="920" y="196" text-anchor="end">-88 +168 = <tspan fill="#3fb950">80</tspan></text>
      <text x="680" y="222">flavor</text><text x="920" y="222" text-anchor="end">+264 -112 = <tspan fill="#3fb950">152</tspan></text>
      <text x="680" y="248">texture</text><text x="920" y="248" text-anchor="end">+132 -56 = <tspan fill="#3fb950">76</tspan></text>
      <text x="680" y="274" fill="#8b949e">calories</text><text x="920" y="274" text-anchor="end" fill="#8b949e">+352 +168 = 520</text>
    </g>
    <text x="680" y="314" font-size="13" fill="#e6edf3">68 × 80 × 152 × 76</text>
    <text x="680" y="338" font-size="15" fill="#e6edf3">= <tspan fill="#3fb950" font-weight="700">62,842,880</tspan></text>
  </g>
</svg>
