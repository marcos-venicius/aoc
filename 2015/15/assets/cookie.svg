    <text x="40" y="70" font-size="13" fill="#8b949e">Butterscotch: −1, −2, 6, 3, cal 8 · Cinnamon: 2, 3, −2, −1, cal 3 · a property total ≤ 0 makes the score 0</text>
    <text x="40" y="108" font-size="12" fill="#8b949e">score</text>
    <line x1="100" y1="400.0" x2="620" y2="400.0" stroke="#21262d"/>
    <text x="90" y="404.0" font-size="12" fill="#8b949e" text-anchor="end">0M</text>
    <line x1="100" y1="360.0" x2="620" y2="360.0" stroke="#21262d"/>
