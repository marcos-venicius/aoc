<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d">
  <title id="t">Matching aunts against the ticker tape (made-up example)</title>
  <desc id="d">Each aunt lists three known things. In part 1 all three must equal the tape. In part 2 cats and trees must be greater than the tape, pomeranians and goldfish must be fewer, and the rest must be equal. Sue 1 matches part 1 and Sue 2 matches part 2.</desc>
  <rect x="1" y="1" width="958" height="438" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="44" font-size="18" font-weight="700" fill="#e6edf3">An aunt matches when all 3 of her known things pass the test</text>
    <text x="40" y="70" font-size="14" fill="#8b949e">made-up tape and aunts · the real tape comes from characteristics.txt</text>

    <!-- tape -->
    <rect x="40" y="96" width="220" height="300" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="60" y="126" font-size="14" font-weight="700" fill="#58a6ff">ticker tape</text>
    <g font-size="15" fill="#e6edf3">
      <text x="60" y="162">children: 4</text>
      <text x="60" y="194">cats: 6</text>
      <text x="60" y="226">trees: 2</text>
      <text x="60" y="258">goldfish: 5</text>
      <text x="60" y="290">pomeranians: 1</text>
      <text x="60" y="322">cars: 3</text>
    </g>
    <g font-size="12">
      <text x="60" y="356" fill="#d2a8ff">part 2: cats, trees  &gt;</text>
      <text x="60" y="376" fill="#d2a8ff">pomeranians, goldfish  &lt;</text>
    </g>

    <!-- table -->
    <g font-size="13" fill="#8b949e">
      <text x="300" y="126">aunt</text>
      <text x="400" y="126">known things</text>
      <text x="790" y="126" text-anchor="middle">part 1 (==)</text>
      <text x="890" y="126" text-anchor="middle">part 2</text>
    </g>
    <line x1="300" y1="138" x2="920" y2="138" stroke="#30363d"/>

    <!-- Sue 1 -->
    <text x="300" y="176" font-size="15" font-weight="700" fill="#e6edf3">Sue 1</text>
    <g font-size="14" fill="#e6edf3">
      <text x="400" y="176">children 4 <tspan fill="#3fb950">=</tspan>, cats 6 <tspan fill="#3fb950">=</tspan>, cars 3 <tspan fill="#3fb950">=</tspan></text>
      <text x="400" y="198" font-size="12" fill="#8b949e">part 2: cats 6 &gt; 6 ? no</text>
    </g>
    <text x="790" y="176" font-size="15" text-anchor="middle" fill="#3fb950" font-weight="700">✓ 3/3</text>
    <text x="890" y="176" font-size="15" text-anchor="middle" fill="#ff7b72">✗</text>

    <!-- Sue 2 -->
    <text x="300" y="246" font-size="15" font-weight="700" fill="#e6edf3">Sue 2</text>
    <g font-size="14" fill="#e6edf3">
      <text x="400" y="246">cats 8, trees 4, goldfish 1</text>
      <text x="400" y="268" font-size="12" fill="#8b949e">part 2: 8 &gt; 6 ✓ · 4 &gt; 2 ✓ · 1 &lt; 5 ✓</text>
    </g>
    <text x="790" y="246" font-size="15" text-anchor="middle" fill="#ff7b72">✗</text>
    <text x="890" y="246" font-size="15" text-anchor="middle" fill="#3fb950" font-weight="700">✓ 3/3</text>

    <!-- Sue 3 -->
    <text x="300" y="316" font-size="15" font-weight="700" fill="#e6edf3">Sue 3</text>
    <g font-size="14" fill="#e6edf3">
      <text x="400" y="316">children 4, cars 1, trees 2</text>
      <text x="400" y="338" font-size="12" fill="#8b949e">cars 1 ≠ 3 fails both parts</text>
    </g>
    <text x="790" y="316" font-size="15" text-anchor="middle" fill="#ff7b72">✗</text>
    <text x="890" y="316" font-size="15" text-anchor="middle" fill="#ff7b72">✗</text>

    <line x1="300" y1="360" x2="920" y2="360" stroke="#30363d"/>
    <text x="300" y="390" font-size="14" fill="#e6edf3">answers: part 1 = <tspan fill="#3fb950" font-weight="700">1</tspan>, part 2 = <tspan fill="#3fb950" font-weight="700">2</tspan></text>
  </g>
</svg>
