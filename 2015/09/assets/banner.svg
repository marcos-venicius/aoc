<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220" role="img" aria-labelledby="t">
  <title id="t">Advent of Code 2015 · Day 09 — All in a Single Night</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="0.5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#f2cc60"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="958" height="218" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="958" height="218" rx="16" fill="url(#grid)" opacity="0.6"/>
  <rect x="1" y="1" width="958" height="218" rx="16" fill="none" stroke="url(#edge)" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="48" y="64" font-size="16" fill="#8b949e" letter-spacing="3">ADVENT OF CODE · 2015</text>
    <text x="48" y="124" font-size="44" font-weight="700" fill="#e6edf3">Day 09</text>
    <text x="48" y="168" font-size="24" fill="#3fb950">All in a Single Night</text>
    <g font-size="22" fill="#f2cc60" text-anchor="end">
      <text x="912" y="64">★ ★</text>
    </g>
    <text x="912" y="168" font-size="15" fill="#8b949e" text-anchor="end">Go · MCA</text>
  </g>
  <!-- decorative route between locations -->
  <g transform="translate(560 34) scale(0.85)">
    <g stroke="#30363d" stroke-width="2" stroke-dasharray="4 5">
      <line x1="20" y1="110" x2="150" y2="30"/>
      <line x1="150" y1="30" x2="230" y2="120"/>
      <line x1="20" y1="110" x2="230" y2="120"/>
      <line x1="90" y1="20" x2="150" y2="30"/>
      <line x1="90" y1="20" x2="20" y2="110"/>
    </g>
    <polyline points="90,20 20,110 150,30 230,120" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linejoin="round" opacity="0.9"/>
    <g fill="#0d1117" stroke="#58a6ff" stroke-width="3">
      <circle cx="20" cy="110" r="7"/>
      <circle cx="150" cy="30" r="7"/>
    </g>
    <circle cx="90" cy="20" r="7" fill="#3fb950"/>
    <circle cx="230" cy="120" r="8" fill="#f2cc60"/>
  </g>
</svg>
