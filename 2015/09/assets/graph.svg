<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="t d">
  <title id="t">From route lines to a two-way distance map</title>
  <desc id="d">Each line of the example (London to Dublin = 464, London to Belfast = 518, Dublin to Belfast = 141) becomes an origin, a destination and a distance, saved in both directions. The result is a triangle of three locations.</desc>
  <rect x="1" y="1" width="958" height="378" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="44" font-size="18" font-weight="700" fill="#e6edf3">Parsing the routes into a distance map</text>
    <text x="40" y="70" font-size="14" fill="#8b949e">&lt;origin&gt; to &lt;destination&gt; = &lt;distance&gt; · every route is stored both ways</text>

    <!-- input lines -->
    <text x="40" y="118" font-size="13" fill="#8b949e">example input</text>
    <g font-size="15">
      <text x="40" y="148"><tspan fill="#58a6ff">London</tspan><tspan fill="#8b949e"> to </tspan><tspan fill="#d2a8ff">Dublin</tspan><tspan fill="#8b949e"> = </tspan><tspan fill="#f2cc60">464</tspan></text>
      <text x="40" y="176"><tspan fill="#58a6ff">London</tspan><tspan fill="#8b949e"> to </tspan><tspan fill="#d2a8ff">Belfast</tspan><tspan fill="#8b949e"> = </tspan><tspan fill="#f2cc60">518</tspan></text>
      <text x="40" y="204"><tspan fill="#58a6ff">Dublin</tspan><tspan fill="#8b949e"> to </tspan><tspan fill="#d2a8ff">Belfast</tspan><tspan fill="#8b949e"> = </tspan><tspan fill="#f2cc60">141</tspan></text>
    </g>
    <g font-size="12">
      <text x="40" y="236"><tspan fill="#58a6ff">■ origin</tspan><tspan fill="#d2a8ff">  ■ destination</tspan><tspan fill="#f2cc60">  ■ distance</tspan></text>
    </g>

    <!-- routes map -->
    <text x="40" y="276" font-size="13" fill="#8b949e">routes[a][b] = routes[b][a]</text>
    <g font-size="13" fill="#e6edf3">
      <text x="40" y="302">London  → Dublin 464, Belfast 518</text>
      <text x="40" y="324">Dublin  → London 464, Belfast 141</text>
      <text x="40" y="346">Belfast → London 518, Dublin  141</text>
    </g>

    <!-- arrow -->
    <line x1="400" y1="210" x2="470" y2="210" stroke="#30363d" stroke-width="2"/>
    <path d="M470 204 L480 210 L470 216 Z" fill="#30363d"/>

    <!-- triangle graph -->
    <g stroke="#58a6ff" stroke-width="3">
      <line x1="560" y1="300" x2="700" y2="120"/>
      <line x1="700" y1="120" x2="860" y2="300"/>
      <line x1="560" y1="300" x2="860" y2="300"/>
    </g>
    <g font-size="15" fill="#f2cc60" text-anchor="middle">
      <text x="606" y="200">464</text>
      <text x="800" y="200">141</text>
      <text x="710" y="324">518</text>
    </g>
    <g fill="#161b22" stroke="#e6edf3" stroke-width="2">
      <circle cx="700" cy="120" r="10"/>
      <circle cx="560" cy="300" r="10"/>
      <circle cx="860" cy="300" r="10"/>
    </g>
    <g font-size="15" fill="#e6edf3" text-anchor="middle">
      <text x="700" y="100">Dublin</text>
      <text x="560" y="342">London</text>
      <text x="860" y="342">Belfast</text>
    </g>
  </g>
</svg>
