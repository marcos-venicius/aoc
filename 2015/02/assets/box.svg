<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">Paper and ribbon for a 2x3x4 present</title>
  <desc id="d">The three faces of a 2 by 3 by 4 box have areas 6, 12 and 8. Paper is twice the sum of the areas plus the smallest area, 58. Ribbon is the smallest perimeter plus the volume, 34.</desc>
  <rect x="1" y="1" width="958" height="398" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="44" font-size="18" font-weight="700" fill="#e6edf3">One present: l=2, w=3, h=4</text>
    <text x="40" y="70" font-size="14" fill="#8b949e">each pair of dimensions is one face · 1 unit = 16 px</text>

    <line x1="480" y1="96" x2="480" y2="370" stroke="#21262d" stroke-width="2"/>

    <!-- PAPER -->
    <text x="40" y="112" font-size="15" font-weight="700" fill="#58a6ff">Part 1 · paper</text>
    <g stroke-width="2">
      <rect x="40" y="136" width="32" height="48" fill="#f2cc60" fill-opacity="0.18" stroke="#f2cc60"/>
      <rect x="150" y="136" width="48" height="64" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff"/>
      <rect x="280" y="136" width="64" height="32" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff"/>
    </g>
    <g font-size="13" fill="#e6edf3">
      <text x="40" y="226">l·w = 6</text>
      <text x="150" y="226">w·h = 12</text>
      <text x="280" y="226">h·l = 8</text>
    </g>
    <text x="40" y="246" font-size="12" fill="#f2cc60">smallest</text>
    <g font-size="15" fill="#e6edf3">
      <text x="40" y="290">2·6 + 2·12 + 2·8 = 52</text>
      <text x="40" y="318"><tspan fill="#8b949e">+ slack (smallest face)</tspan> <tspan fill="#f2cc60">6</tspan></text>
      <text x="40" y="354" font-weight="700">= <tspan fill="#3fb950">58</tspan> square feet</text>
    </g>

    <!-- RIBBON -->
    <text x="510" y="112" font-size="15" font-weight="700" fill="#58a6ff">Part 2 · ribbon</text>
    <g fill="none" stroke-width="3">
      <rect x="510" y="136" width="48" height="64" stroke="#8b949e" stroke-dasharray="5 4"/>
      <rect x="630" y="136" width="32" height="64" stroke="#8b949e" stroke-dasharray="5 4"/>
      <rect x="740" y="136" width="32" height="48" stroke="#f2cc60"/>
    </g>
    <g font-size="13" fill="#e6edf3">
      <text x="510" y="226">2(w+h) = 14</text>
      <text x="630" y="226">2(l+h) = 12</text>
      <text x="740" y="226">2(l+w) = 10</text>
    </g>
    <text x="740" y="246" font-size="12" fill="#f2cc60">smallest perimeter</text>
    <g font-size="15" fill="#e6edf3">
      <text x="510" y="290"><tspan fill="#8b949e">wrap:</tspan> <tspan fill="#f2cc60">10</tspan></text>
      <text x="510" y="318"><tspan fill="#8b949e">+ bow (volume)</tspan> 2·3·4 = 24</text>
      <text x="510" y="354" font-weight="700">= <tspan fill="#3fb950">34</tspan> feet</text>
    </g>
  </g>
</svg>
