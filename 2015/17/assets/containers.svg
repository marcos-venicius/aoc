<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 574" width="960" height="574" role="img" aria-labelledby="t d">
  <title id="t">Combinations of containers that hold exactly 25 liters</title>
  <desc id="d">With containers 20, 15, 10, 5 and 5, every combination of size 1 to 5 is checked. Four of them add up to 25: 20 + 5, 20 + 5 (the other 5), 15 + 10, and 15 + 5 + 5.</desc>
  <rect x="1" y="1" width="958" height="572" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="44" font-size="18" font-weight="700" fill="#e6edf3">Example: fill exactly 25 liters with 20, 15, 10, 5, 5</text>
    <text x="40" y="70" font-size="14" fill="#8b949e">itertools.combinations for every size r, keep the ones whose sum is the target</text>
    <rect x="120" y="102" width="40" height="48" rx="4" fill="#161b22" fill-opacity="1" stroke="#30363d" stroke-width="2"/>
    <text x="140.0" y="168" font-size="13" text-anchor="middle" fill="#8b949e">20</text>
    <rect x="178" y="114" width="40" height="36" rx="4" fill="#161b22" fill-opacity="1" stroke="#30363d" stroke-width="2"/>
    <text x="198.0" y="168" font-size="13" text-anchor="middle" fill="#8b949e">15</text>
    <rect x="236" y="126" width="40" height="24" rx="4" fill="#161b22" fill-opacity="1" stroke="#30363d" stroke-width="2"/>
    <text x="256.0" y="168" font-size="13" text-anchor="middle" fill="#8b949e">10</text>
    <rect x="294" y="138" width="40" height="12" rx="4" fill="#161b22" fill-opacity="1" stroke="#30363d" stroke-width="2"/>
    <text x="314.0" y="168" font-size="13" text-anchor="middle" fill="#8b949e">5</text>
    <rect x="352" y="138" width="40" height="12" rx="4" fill="#161b22" fill-opacity="1" stroke="#30363d" stroke-width="2"/>
    <text x="372.0" y="168" font-size="13" text-anchor="middle" fill="#8b949e">5′</text>
    <text x="430" y="142" font-size="15" fill="#e6edf3"><tspan fill="#8b949e">the containers (5 and 5′ are different containers)</tspan></text>
    <rect x="120" y="188" width="40" height="48" rx="4" fill="#3fb950" fill-opacity="0.35" stroke="#3fb950" stroke-width="2"/>
    <text x="140.0" y="254" font-size="13" text-anchor="middle" fill="#e6edf3">20</text>
    <rect x="178" y="200" width="40" height="36" rx="4" fill="#161b22" fill-opacity="1" stroke="#30363d" stroke-width="2"/>
    <text x="198.0" y="254" font-size="13" text-anchor="middle" fill="#8b949e">15</text>
    <rect x="236" y="212" width="40" height="24" rx="4" fill="#161b22" fill-opacity="1" stroke="#30363d" stroke-width="2"/>
    <text x="256.0" y="254" font-size="13" text-anchor="middle" fill="#8b949e">10</text>
    <rect x="294" y="224" width="40" height="12" rx="4" fill="#3fb950" fill-opacity="0.35" stroke="#3fb950" stroke-width="2"/>
    <text x="314.0" y="254" font-size="13" text-anchor="middle" fill="#e6edf3">5</text>
    <rect x="352" y="224" width="40" height="12" rx="4" fill="#161b22" fill-opacity="1" stroke="#30363d" stroke-width="2"/>
    <text x="372.0" y="254" font-size="13" text-anchor="middle" fill="#8b949e">5′</text>
    <text x="430" y="228" font-size="15" fill="#e6edf3">20 + 5 = <tspan fill="#3fb950">25</tspan></text>
    <rect x="120" y="274" width="40" height="48" rx="4" fill="#3fb950" fill-opacity="0.35" stroke="#3fb950" stroke-width="2"/>
    <text x="140.0" y="340" font-size="13" text-anchor="middle" fill="#e6edf3">20</text>
    <rect x="178" y="286" width="40" height="36" rx="4" fill="#161b22" fill-opacity="1" stroke="#30363d" stroke-width="2"/>
    <text x="198.0" y="340" font-size="13" text-anchor="middle" fill="#8b949e">15</text>
    <rect x="236" y="298" width="40" height="24" rx="4" fill="#161b22" fill-opacity="1" stroke="#30363d" stroke-width="2"/>
    <text x="256.0" y="340" font-size="13" text-anchor="middle" fill="#8b949e">10</text>
    <rect x="294" y="310" width="40" height="12" rx="4" fill="#161b22" fill-opacity="1" stroke="#30363d" stroke-width="2"/>
    <text x="314.0" y="340" font-size="13" text-anchor="middle" fill="#8b949e">5</text>
    <rect x="352" y="310" width="40" height="12" rx="4" fill="#3fb950" fill-opacity="0.35" stroke="#3fb950" stroke-width="2"/>
    <text x="372.0" y="340" font-size="13" text-anchor="middle" fill="#e6edf3">5′</text>
    <text x="430" y="314" font-size="15" fill="#e6edf3">20 + 5′ = <tspan fill="#3fb950">25</tspan></text>
    <rect x="120" y="360" width="40" height="48" rx="4" fill="#161b22" fill-opacity="1" stroke="#30363d" stroke-width="2"/>
    <text x="140.0" y="426" font-size="13" text-anchor="middle" fill="#8b949e">20</text>
    <rect x="178" y="372" width="40" height="36" rx="4" fill="#3fb950" fill-opacity="0.35" stroke="#3fb950" stroke-width="2"/>
    <text x="198.0" y="426" font-size="13" text-anchor="middle" fill="#e6edf3">15</text>
    <rect x="236" y="384" width="40" height="24" rx="4" fill="#3fb950" fill-opacity="0.35" stroke="#3fb950" stroke-width="2"/>
    <text x="256.0" y="426" font-size="13" text-anchor="middle" fill="#e6edf3">10</text>
    <rect x="294" y="396" width="40" height="12" rx="4" fill="#161b22" fill-opacity="1" stroke="#30363d" stroke-width="2"/>
    <text x="314.0" y="426" font-size="13" text-anchor="middle" fill="#8b949e">5</text>
    <rect x="352" y="396" width="40" height="12" rx="4" fill="#161b22" fill-opacity="1" stroke="#30363d" stroke-width="2"/>
    <text x="372.0" y="426" font-size="13" text-anchor="middle" fill="#8b949e">5′</text>
    <text x="430" y="400" font-size="15" fill="#e6edf3">15 + 10 = <tspan fill="#3fb950">25</tspan></text>
    <rect x="120" y="446" width="40" height="48" rx="4" fill="#161b22" fill-opacity="1" stroke="#30363d" stroke-width="2"/>
    <text x="140.0" y="512" font-size="13" text-anchor="middle" fill="#8b949e">20</text>
    <rect x="178" y="458" width="40" height="36" rx="4" fill="#3fb950" fill-opacity="0.35" stroke="#3fb950" stroke-width="2"/>
    <text x="198.0" y="512" font-size="13" text-anchor="middle" fill="#e6edf3">15</text>
    <rect x="236" y="470" width="40" height="24" rx="4" fill="#161b22" fill-opacity="1" stroke="#30363d" stroke-width="2"/>
    <text x="256.0" y="512" font-size="13" text-anchor="middle" fill="#8b949e">10</text>
    <rect x="294" y="482" width="40" height="12" rx="4" fill="#3fb950" fill-opacity="0.35" stroke="#3fb950" stroke-width="2"/>
    <text x="314.0" y="512" font-size="13" text-anchor="middle" fill="#e6edf3">5</text>
    <rect x="352" y="482" width="40" height="12" rx="4" fill="#3fb950" fill-opacity="0.35" stroke="#3fb950" stroke-width="2"/>
    <text x="372.0" y="512" font-size="13" text-anchor="middle" fill="#e6edf3">5′</text>
    <text x="430" y="486" font-size="15" fill="#e6edf3">15 + 5 + 5′ = <tspan fill="#3fb950">25</tspan></text>
    <text x="40" y="546" font-size="13" fill="#8b949e">combinations tried for r = 1 to 5: 31 in total   →  <tspan fill="#3fb950" font-weight="700">4</tspan> ways</text>
  </g>
</svg>
