<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="t d">
  <title id="t">Counting code, memory and encoded characters</title>
  <desc id="d">After dropping the surrounding quotes, a scanner walks the string: a normal character advances 1, an escaped quote or backslash advances 2, and a hex escape advances 4, each adding one memory character. The table shows code, memory and encoded lengths for the four example strings, giving 23 - 11 = 12 and 42 - 23 = 19.</desc>
  <rect x="1" y="1" width="958" height="498" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="44" font-size="18" font-weight="700" fill="#e6edf3">Part 1: scan the inside of the literal, one memory char per jump</text>

    <!-- scanner for "aaa\"aaa" -->
    <text x="40" y="84" font-size="14" fill="#8b949e">line "aaa\"aaa" → inner part aaa\"aaa</text>
    <g fill="#161b22" stroke="#30363d">
      <rect x="40" y="120" width="40" height="40" rx="5"/>
      <rect x="86" y="120" width="40" height="40" rx="5"/>
      <rect x="132" y="120" width="40" height="40" rx="5"/>
      <rect x="178" y="120" width="86" height="40" rx="5" stroke="#f2cc60"/>
      <rect x="270" y="120" width="40" height="40" rx="5"/>
      <rect x="316" y="120" width="40" height="40" rx="5"/>
      <rect x="362" y="120" width="40" height="40" rx="5"/>
    </g>
    <g font-size="20" fill="#e6edf3" text-anchor="middle">
      <text x="60" y="147">a</text><text x="106" y="147">a</text><text x="152" y="147">a</text>
      <text x="221" y="147" fill="#f2cc60">\"</text>
      <text x="290" y="147">a</text><text x="336" y="147">a</text><text x="382" y="147">a</text>
    </g>
    <g font-size="12" fill="#8b949e" text-anchor="middle">
      <text x="60" y="112">+1</text><text x="106" y="112">+1</text><text x="152" y="112">+1</text>
      <text x="221" y="112" fill="#f2cc60">+2</text>
      <text x="290" y="112">+1</text><text x="336" y="112">+1</text><text x="382" y="112">+1</text>
    </g>
    <text x="40" y="188" font-size="14" fill="#e6edf3">8 code chars inside → <tspan fill="#3fb950">7</tspan> memory chars</text>

    <!-- scanner for "\x27" -->
    <text x="520" y="84" font-size="14" fill="#8b949e">line "\x27" → inner part \x27</text>
    <g fill="#161b22">
      <rect x="520" y="120" width="160" height="40" rx="5" stroke="#ff7b72"/>
    </g>
    <text x="600" y="147" font-size="20" fill="#ff7b72" text-anchor="middle">\x27</text>
    <text x="600" y="112" font-size="12" fill="#ff7b72" text-anchor="middle">+4</text>
    <text x="520" y="188" font-size="14" fill="#e6edf3">4 code chars inside → <tspan fill="#3fb950">1</tspan> memory char</text>
    <g font-size="13" fill="#8b949e">
      <text x="740" y="100">step rules</text>
      <text x="740" y="122">plain char</text><text x="880" y="122" text-anchor="end">+1</text>
      <text x="740" y="142">\" or \\</text><text x="880" y="142" text-anchor="end">+2</text>
      <text x="740" y="162">\xNN</text><text x="880" y="162" text-anchor="end">+4</text>
    </g>

    <line x1="40" y1="214" x2="920" y2="214" stroke="#21262d" stroke-width="2"/>

    <!-- table -->
    <text x="40" y="250" font-size="15" font-weight="700" fill="#58a6ff">The four example lines</text>
    <g font-size="13" fill="#8b949e" text-anchor="end">
      <text x="440" y="250">code</text>
      <text x="560" y="250">memory</text>
      <text x="880" y="250">encoded</text>
    </g>
    <line x1="40" y1="262" x2="920" y2="262" stroke="#30363d"/>
    <g font-size="16" fill="#e6edf3">
      <text x="40" y="292">""</text>
      <text x="40" y="322">"abc"</text>
      <text x="40" y="352">"aaa\"aaa"</text>
      <text x="40" y="382">"\x27"</text>
    </g>
    <g font-size="13" fill="#8b949e">
      <text x="600" y="292">"\"\""</text>
      <text x="600" y="322">"\"abc\""</text>
      <text x="600" y="352">"\"aaa\\\"aaa\""</text>
      <text x="600" y="382">"\"\\x27\""</text>
    </g>
    <g font-size="16" fill="#e6edf3" text-anchor="end">
      <text x="440" y="292">2</text><text x="560" y="292">0</text><text x="880" y="292">6</text>
      <text x="440" y="322">5</text><text x="560" y="322">3</text><text x="880" y="322">9</text>
      <text x="440" y="352">10</text><text x="560" y="352">7</text><text x="880" y="352">16</text>
      <text x="440" y="382">6</text><text x="560" y="382">1</text><text x="880" y="382">11</text>
    </g>
    <line x1="40" y1="396" x2="920" y2="396" stroke="#30363d"/>
    <g font-size="16" font-weight="700" text-anchor="end">
      <text x="440" y="422" fill="#e6edf3">23</text>
      <text x="560" y="422" fill="#e6edf3">11</text>
      <text x="880" y="422" fill="#e6edf3">42</text>
    </g>
    <text x="40" y="422" font-size="14" fill="#8b949e">total</text>
    <g font-size="15">
      <text x="40" y="466" fill="#e6edf3">part 1 = code − memory = 23 − 11 = <tspan fill="#3fb950" font-weight="700">12</tspan></text>
      <text x="520" y="466" fill="#e6edf3">part 2 = encoded − code = 42 − 23 = <tspan fill="#3fb950" font-weight="700">19</tspan></text>
    </g>
  </g>
</svg>
