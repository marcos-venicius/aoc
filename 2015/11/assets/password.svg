<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d">
  <title id="t">Incrementing a password and checking the rules</title>
  <desc id="d">The password is incremented like a base-26 odometer from the last letter, with z wrapping to a and carrying left. A blocked letter i, o or l is bumped once more. The first valid password after abcdefgh is abcdffaa: it has the straight abc, no blocked letters and two pairs ff and aa.</desc>
  <rect x="1" y="1" width="958" height="468" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="44" font-size="18" font-weight="700" fill="#e6edf3">Increment like an odometer, then test the rules</text>
    <text x="40" y="70" font-size="14" fill="#8b949e">letters are stored as character codes · a … z, then z wraps to a and carries one position left</text>

    <!-- increment examples -->
    <g font-size="17">
      <text x="40" y="118" fill="#e6edf3">abcdefg<tspan fill="#58a6ff">h</tspan></text>
      <text x="170" y="118" fill="#8b949e">+1 →</text>
      <text x="230" y="118" fill="#e6edf3">abcdefg<tspan fill="#ff7b72">i</tspan></text>
      <text x="360" y="118" fill="#8b949e">blocked, bump →</text>
      <text x="530" y="118" fill="#e6edf3">abcdefg<tspan fill="#3fb950">j</tspan></text>

      <text x="40" y="156" fill="#e6edf3">abcdefg<tspan fill="#58a6ff">z</tspan></text>
      <text x="170" y="156" fill="#8b949e">+1 →</text>
      <text x="230" y="156" fill="#e6edf3">abcdef<tspan fill="#3fb950">h</tspan><tspan fill="#f2cc60">a</tspan></text>
      <text x="360" y="156" fill="#8b949e">z → a, carry into the previous letter</text>
    </g>

    <line x1="40" y1="184" x2="920" y2="184" stroke="#21262d" stroke-width="2"/>

    <!-- rule check on abcdffaa -->
    <text x="40" y="220" font-size="15" font-weight="700" fill="#58a6ff">Keep incrementing from abcdefgh until every rule passes: abcdffaa</text>
    <g fill="#161b22" stroke="#30363d">
      <rect x="40" y="244" width="44" height="44" rx="6"/>
      <rect x="92" y="244" width="44" height="44" rx="6"/>
      <rect x="144" y="244" width="44" height="44" rx="6"/>
      <rect x="196" y="244" width="44" height="44" rx="6"/>
      <rect x="248" y="244" width="44" height="44" rx="6"/>
      <rect x="300" y="244" width="44" height="44" rx="6"/>
      <rect x="352" y="244" width="44" height="44" rx="6"/>
      <rect x="404" y="244" width="44" height="44" rx="6"/>
    </g>
    <g font-size="22" text-anchor="middle" fill="#e6edf3">
      <text x="62" y="274" fill="#d2a8ff">a</text>
      <text x="114" y="274" fill="#d2a8ff">b</text>
      <text x="166" y="274" fill="#d2a8ff">c</text>
      <text x="218" y="274">d</text>
      <text x="270" y="274" fill="#f2cc60">f</text>
      <text x="322" y="274" fill="#f2cc60">f</text>
      <text x="374" y="274" fill="#f2cc60">a</text>
      <text x="426" y="274" fill="#f2cc60">a</text>
    </g>
    <g font-size="11" fill="#8b949e" text-anchor="middle">
      <text x="62" y="306">0</text><text x="114" y="306">1</text><text x="166" y="306">2</text><text x="218" y="306">3</text>
      <text x="270" y="306">4</text><text x="322" y="306">5</text><text x="374" y="306">6</text><text x="426" y="306">7</text>
    </g>
    <path d="M44 318 H184" stroke="#d2a8ff" stroke-width="3"/>
    <path d="M252 318 H340" stroke="#f2cc60" stroke-width="3"/>
    <path d="M356 318 H444" stroke="#f2cc60" stroke-width="3"/>

    <g font-size="14">
      <text x="500" y="250" fill="#d2a8ff">✓ straight of 3: b − a = 1 and c − b = 1</text>
      <text x="500" y="280" fill="#3fb950">✓ no blocked letter (i, o, l)</text>
      <text x="500" y="310" fill="#f2cc60">✓ 2 pairs: ff at 4, aa at 6</text>
    </g>
    <g font-size="13" fill="#8b949e">
      <text x="40" y="360">How the code counts a pair at index i (for i ≥ 1):</text>
      <text x="40" y="384"><tspan fill="#e6edf3">data[i] == data[i+1]</tspan> and <tspan fill="#e6edf3">data[i-1] != data[i]</tspan>   → so "aaa" counts as one pair, not two</text>
      <text x="40" y="420">Part 2 increments the part 1 answer once and repeats the same search:</text>
      <text x="40" y="444"><tspan fill="#e6edf3">abcdffaa</tspan> → … → <tspan fill="#3fb950">abcdffbb</tspan></text>
    </g>
  </g>
</svg>
