<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 488" width="960" height="488" role="img" aria-labelledby="t d">
  <title id="t">Look-and-say: reading runs of equal digits</title>
  <desc id="d">Starting from 1, each step reads runs of equal digits and writes count then digit: 1, 11, 21, 1211, 111221, 312211.</desc>
  <rect x="1" y="1" width="958" height="486" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="44" font-size="18" font-weight="700" fill="#e6edf3">Each step: group equal neighbours, write (count, digit)</text>
    <text x="40" y="70" font-size="14" fill="#8b949e">underlines mark the runs · 3×1 means "three 1s" and is written as 31</text>
    <text x="40" y="134" font-size="13" fill="#8b949e">step 0</text>
    <rect x="130" y="110" width="28" height="34" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="144" y="133" font-size="18" fill="#e6edf3" text-anchor="middle">1</text>
    <path d="M130 152 H158" stroke="#58a6ff" stroke-width="3"/>
    <text x="420" y="134" font-size="14" fill="#8b949e">read: <tspan fill="#e6edf3">1×1</tspan></text>
    <text x="760" y="134" font-size="14" fill="#8b949e">→ <tspan fill="#3fb950">11</tspan></text>
    <text x="40" y="192" font-size="13" fill="#8b949e">step 1</text>
    <rect x="130" y="168" width="28" height="34" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="144" y="191" font-size="18" fill="#e6edf3" text-anchor="middle">1</text>
    <rect x="164" y="168" width="28" height="34" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="178" y="191" font-size="18" fill="#e6edf3" text-anchor="middle">1</text>
    <path d="M130 210 H192" stroke="#58a6ff" stroke-width="3"/>
    <text x="420" y="192" font-size="14" fill="#8b949e">read: <tspan fill="#e6edf3">2×1</tspan></text>
    <text x="760" y="192" font-size="14" fill="#8b949e">→ <tspan fill="#3fb950">21</tspan></text>
    <text x="40" y="250" font-size="13" fill="#8b949e">step 2</text>
    <rect x="130" y="226" width="28" height="34" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="144" y="249" font-size="18" fill="#e6edf3" text-anchor="middle">2</text>
    <path d="M130 268 H158" stroke="#58a6ff" stroke-width="3"/>
    <rect x="164" y="226" width="28" height="34" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="178" y="249" font-size="18" fill="#e6edf3" text-anchor="middle">1</text>
    <path d="M164 268 H192" stroke="#d2a8ff" stroke-width="3"/>
    <text x="420" y="250" font-size="14" fill="#8b949e">read: <tspan fill="#e6edf3">1×2, 1×1</tspan></text>
    <text x="760" y="250" font-size="14" fill="#8b949e">→ <tspan fill="#3fb950">1211</tspan></text>
    <text x="40" y="308" font-size="13" fill="#8b949e">step 3</text>
    <rect x="130" y="284" width="28" height="34" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="144" y="307" font-size="18" fill="#e6edf3" text-anchor="middle">1</text>
    <path d="M130 326 H158" stroke="#58a6ff" stroke-width="3"/>
    <rect x="164" y="284" width="28" height="34" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="178" y="307" font-size="18" fill="#e6edf3" text-anchor="middle">2</text>
    <path d="M164 326 H192" stroke="#d2a8ff" stroke-width="3"/>
    <rect x="198" y="284" width="28" height="34" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="212" y="307" font-size="18" fill="#e6edf3" text-anchor="middle">1</text>
    <rect x="232" y="284" width="28" height="34" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="246" y="307" font-size="18" fill="#e6edf3" text-anchor="middle">1</text>
    <path d="M198 326 H260" stroke="#58a6ff" stroke-width="3"/>
    <text x="420" y="308" font-size="14" fill="#8b949e">read: <tspan fill="#e6edf3">1×1, 1×2, 2×1</tspan></text>
    <text x="760" y="308" font-size="14" fill="#8b949e">→ <tspan fill="#3fb950">111221</tspan></text>
    <text x="40" y="366" font-size="13" fill="#8b949e">step 4</text>
    <rect x="130" y="342" width="28" height="34" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="144" y="365" font-size="18" fill="#e6edf3" text-anchor="middle">1</text>
    <rect x="164" y="342" width="28" height="34" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="178" y="365" font-size="18" fill="#e6edf3" text-anchor="middle">1</text>
    <rect x="198" y="342" width="28" height="34" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="212" y="365" font-size="18" fill="#e6edf3" text-anchor="middle">1</text>
    <path d="M130 384 H226" stroke="#58a6ff" stroke-width="3"/>
    <rect x="232" y="342" width="28" height="34" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="246" y="365" font-size="18" fill="#e6edf3" text-anchor="middle">2</text>
    <rect x="266" y="342" width="28" height="34" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="280" y="365" font-size="18" fill="#e6edf3" text-anchor="middle">2</text>
    <path d="M232 384 H294" stroke="#d2a8ff" stroke-width="3"/>
    <rect x="300" y="342" width="28" height="34" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="314" y="365" font-size="18" fill="#e6edf3" text-anchor="middle">1</text>
    <path d="M300 384 H328" stroke="#58a6ff" stroke-width="3"/>
    <text x="420" y="366" font-size="14" fill="#8b949e">read: <tspan fill="#e6edf3">3×1, 2×2, 1×1</tspan></text>
    <text x="760" y="366" font-size="14" fill="#8b949e">→ <tspan fill="#3fb950">312211</tspan></text>
    <text x="40" y="424" font-size="13" fill="#8b949e">step 5</text>
    <rect x="130" y="400" width="28" height="34" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="144" y="423" font-size="18" fill="#e6edf3" text-anchor="middle">3</text>
    <rect x="164" y="400" width="28" height="34" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="178" y="423" font-size="18" fill="#e6edf3" text-anchor="middle">1</text>
    <rect x="198" y="400" width="28" height="34" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="212" y="423" font-size="18" fill="#e6edf3" text-anchor="middle">2</text>
    <rect x="232" y="400" width="28" height="34" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="246" y="423" font-size="18" fill="#e6edf3" text-anchor="middle">2</text>
    <rect x="266" y="400" width="28" height="34" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="280" y="423" font-size="18" fill="#e6edf3" text-anchor="middle">1</text>
    <rect x="300" y="400" width="28" height="34" rx="5" fill="#161b22" stroke="#30363d"/>
    <text x="314" y="423" font-size="18" fill="#e6edf3" text-anchor="middle">1</text>
    <text x="420" y="424" font-size="14" fill="#8b949e">length grows by about 30% per step</text>
  </g>
</svg>
