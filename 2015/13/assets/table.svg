<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="t d">
  <title id="t">Best seating for the four-person example</title>
  <desc id="d">Each edge of the circular table is worth the happiness both neighbours feel about each other. The best order Alice, Bob, Carol, David gives 137 + 53 + 96 + 44 = 330. The matrix on the right lists how much each person gains or loses next to each other person.</desc>
  <rect x="1" y="1" width="958" height="478" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="44" font-size="18" font-weight="700" fill="#e6edf3">A seat edge is worth both directions: data[a][b] + data[b][a]</text>

    <!-- table -->
    <circle cx="240" cy="270" r="60" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <g fill="none" stroke-width="3">
      <path d="M268 150 Q 356 182 368 244" stroke="#3fb950"/>
      <path d="M368 296 Q 356 358 268 390" stroke="#3fb950"/>
      <path d="M212 390 Q 124 358 112 296" stroke="#3fb950"/>
      <path d="M112 244 Q 124 182 212 150" stroke="#3fb950"/>
    </g>
    <g stroke-width="2" fill="#0d1117">
      <circle cx="240" cy="140" r="26" stroke="#f2cc60"/>
      <circle cx="370" cy="270" r="26" stroke="#58a6ff"/>
      <circle cx="240" cy="400" r="26" stroke="#58a6ff"/>
      <circle cx="110" cy="270" r="26" stroke="#58a6ff"/>
    </g>
    <g font-size="14" text-anchor="middle" fill="#e6edf3">
      <text x="240" y="145">Alice</text>
      <text x="370" y="275">Bob</text>
      <text x="240" y="405">Carol</text>
      <text x="110" y="275">David</text>
    </g>
    <g font-size="13" fill="#e6edf3">
      <text x="340" y="170">54+83 = <tspan fill="#3fb950" font-weight="700">137</tspan></text>
      <text x="340" y="380">−7+60 = <tspan fill="#3fb950" font-weight="700">53</tspan></text>
      <text x="140" y="380" text-anchor="end">55+41 = <tspan fill="#3fb950" font-weight="700">96</tspan></text>
      <text x="140" y="170" text-anchor="end">46−2 = <tspan fill="#3fb950" font-weight="700">44</tspan></text>
    </g>
    <text x="240" y="266" font-size="12" text-anchor="middle" fill="#8b949e">total</text>
    <text x="240" y="288" font-size="20" text-anchor="middle" fill="#3fb950" font-weight="700">330</text>
    <text x="240" y="108" font-size="12" text-anchor="middle" fill="#f2cc60">fixed start</text>

    <!-- matrix -->
    <text x="540" y="96" font-size="15" font-weight="700" fill="#58a6ff">data[row][col]</text>
    <text x="540" y="116" font-size="12" fill="#8b949e">happiness of row when sitting next to col</text>
    <g font-size="13" fill="#8b949e" text-anchor="end">
      <text x="680" y="150">Alice</text><text x="750" y="150">Bob</text><text x="820" y="150">Carol</text><text x="890" y="150">David</text>
    </g>
    <g font-size="13" fill="#8b949e">
      <text x="540" y="182">Alice</text><text x="540" y="214">Bob</text><text x="540" y="246">Carol</text><text x="540" y="278">David</text>
    </g>
    <line x1="540" y1="160" x2="900" y2="160" stroke="#30363d"/>
    <g font-size="15" text-anchor="end">
      <text x="680" y="182" fill="#484f58">·</text><text x="750" y="182" fill="#3fb950">54</text><text x="820" y="182" fill="#ff7b72">−79</text><text x="890" y="182" fill="#ff7b72">−2</text>
      <text x="680" y="214" fill="#3fb950">83</text><text x="750" y="214" fill="#484f58">·</text><text x="820" y="214" fill="#ff7b72">−7</text><text x="890" y="214" fill="#ff7b72">−63</text>
      <text x="680" y="246" fill="#ff7b72">−62</text><text x="750" y="246" fill="#3fb950">60</text><text x="820" y="246" fill="#484f58">·</text><text x="890" y="246" fill="#3fb950">55</text>
      <text x="680" y="278" fill="#3fb950">46</text><text x="750" y="278" fill="#ff7b72">−7</text><text x="820" y="278" fill="#3fb950">41</text><text x="890" y="278" fill="#484f58">·</text>
    </g>

    <g font-size="13" fill="#8b949e">
      <text x="540" y="330">DFS from Alice tries every order of the others:</text>
      <text x="540" y="354"><tspan fill="#e6edf3">3! = 6</tspan> seatings instead of 4! = 24,</text>
      <text x="540" y="378">since rotating the circle changes nothing.</text>
      <text x="540" y="414">Part 2 adds <tspan fill="#d2a8ff">Me</tspan> with 0 to and from everyone</text>
      <text x="540" y="438">and runs the same search again.</text>
    </g>
  </g>
</svg>
