<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d">
  <title id="t">Detecting a repeated pair without overlap</title>
  <desc id="d">The map stores the index where each pair is first seen. In aaa the second aa starts at index 1, which is not after the stored index 1, so it overlaps. In aaaa the pair at index 2 starts after it, so the rule passes.</desc>
  <rect x="1" y="1" width="958" height="328" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="44" font-size="18" font-weight="700" fill="#e6edf3">Part 2, rule 1: remember only the first time each pair is seen</text>
    <text x="40" y="70" font-size="14" fill="#8b949e">at index i the pair is line[i-1..i] · m[pair] = i on first sight · later: overlap-free if i-1 &gt; m[pair]</text>

    <!-- aaa -->
    <text x="40" y="116" font-size="15" font-weight="700" fill="#58a6ff">"aaa"</text>
    <g font-size="12" fill="#8b949e" text-anchor="middle">
      <text x="160" y="104">0</text><text x="210" y="104">1</text><text x="260" y="104">2</text>
    </g>
    <g fill="#161b22" stroke="#30363d">
      <rect x="140" y="110" width="40" height="40" rx="5"/>
      <rect x="190" y="110" width="40" height="40" rx="5"/>
      <rect x="240" y="110" width="40" height="40" rx="5"/>
    </g>
    <g font-size="20" fill="#e6edf3" text-anchor="middle">
      <text x="160" y="137">a</text><text x="210" y="137">a</text><text x="260" y="137">a</text>
    </g>
    <path d="M144 160 H226" stroke="#f2cc60" stroke-width="3"/>
    <path d="M194 172 H276" stroke="#ff7b72" stroke-width="3"/>
    <g font-size="14">
      <text x="330" y="126" fill="#e6edf3">i=1: "aa" new → m["aa"] = 1</text>
      <text x="330" y="152" fill="#e6edf3">i=2: "aa" seen, i-1 = 1 &gt; 1 ? <tspan fill="#ff7b72">no, it overlaps</tspan></text>
      <text x="330" y="178" fill="#ff7b72" font-weight="700">rule fails</text>
    </g>

    <line x1="40" y1="202" x2="920" y2="202" stroke="#21262d" stroke-width="2"/>

    <!-- aaaa -->
    <text x="40" y="248" font-size="15" font-weight="700" fill="#58a6ff">"aaaa"</text>
    <g font-size="12" fill="#8b949e" text-anchor="middle">
      <text x="160" y="236">0</text><text x="210" y="236">1</text><text x="260" y="236">2</text><text x="310" y="236">3</text>
    </g>
    <g fill="#161b22" stroke="#30363d">
      <rect x="140" y="242" width="40" height="40" rx="5"/>
      <rect x="190" y="242" width="40" height="40" rx="5"/>
      <rect x="240" y="242" width="40" height="40" rx="5"/>
      <rect x="290" y="242" width="40" height="40" rx="5"/>
    </g>
    <g font-size="20" fill="#e6edf3" text-anchor="middle">
      <text x="160" y="269">a</text><text x="210" y="269">a</text><text x="260" y="269">a</text><text x="310" y="269">a</text>
    </g>
    <path d="M144 292 H226" stroke="#f2cc60" stroke-width="3"/>
    <path d="M244 292 H326" stroke="#3fb950" stroke-width="3"/>
    <g font-size="14">
      <text x="380" y="248" fill="#e6edf3">i=1: m["aa"] = 1 · i=2: 1 &gt; 1 ? no (kept as 1)</text>
      <text x="380" y="274" fill="#e6edf3">i=3: "aa" seen, i-1 = 2 &gt; 1 ? <tspan fill="#3fb950">yes</tspan></text>
      <text x="380" y="300" fill="#3fb950" font-weight="700">rule passes</text>
    </g>
  </g>
</svg>
