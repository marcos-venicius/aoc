    <text x="620" y="130" font-size="16" font-weight="700" fill="#e6edf3">Part 1</text>
    <text x="620" y="160" font-size="15" fill="#e6edf3">1721 + 299 = <tspan fill="#f2cc60">2020</tspan></text>
    <text x="620" y="186" font-size="15" fill="#8b949e">answer: 1721 × 299</text>

    <text x="620" y="250" font-size="16" font-weight="700" fill="#e6edf3">Part 2 · one more loop</text>
    <text x="620" y="280" font-size="15" fill="#e6edf3">979 + 366 + 675 = <tspan fill="#f2cc60">2020</tspan></text>
    <text x="620" y="306" font-size="15" fill="#8b949e">answer: 979 × 366 × 675</text>
    <text x="620" y="340" font-size="12" fill="#8b949e">both loops return at the first hit</text>
