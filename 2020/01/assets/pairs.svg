<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">Searching the example expense report for entries that sum to 2020</title>
  <desc id="d">A matrix of pair sums for the entries 1721, 979, 366, 299, 675 and 1456. Only the cells above the diagonal are tried by the MCA version; the pair 1721 and 299 sums to 2020. For part 2, the triple 979, 366 and 675 sums to 2020.</desc>
