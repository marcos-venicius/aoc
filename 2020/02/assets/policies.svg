    <text x="40" y="70" font-size="14" fill="#8b949e">boxes outlined = the two positions used by part 2 (<tspan fill="#3fb950">letter matches</tspan> / <tspan fill="#ff7b72">does not</tspan>)</text>
    <text x="560" y="104" font-size="14" font-weight="700" fill="#58a6ff">P1: count in range</text>
    <text x="740" y="104" font-size="14" font-weight="700" fill="#d2a8ff">P2: exactly one</text>
        <text x="40" y="146" font-size="17" fill="#e6edf3">1-3 a: </text>
    <rect x="200" y="120" width="32" height="38" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="216" y="146" font-size="18" text-anchor="middle" fill="#f2cc60">a</text>
    <text x="216" y="176" font-size="11" text-anchor="middle" fill="#8b949e">1</text>
