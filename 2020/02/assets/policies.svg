<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">The two password policies on the example lines</title>
  <desc id="d">Part 1 counts the letter and checks the count is within the range: abcde and ccccccccc pass. Part 2 treats the numbers as 1-based positions and requires exactly one of them to hold the letter: only abcde passes.</desc>
  <rect x="1" y="1" width="958" height="398" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
