    <text x="60" y="518" font-size="13" fill="#d2a8ff">bottom row sum = 6 timelines (part 2)</text>
    <text x="540" y="124" font-size="14" fill="#f2cc60">part 1 · travelTachyon</text>
    <text x="540" y="146" font-size="12" fill="#e6edf3">follow the beam down, marking '|'</text>
    <text x="540" y="168" font-size="12" fill="#e6edf3">on '^': count a split, mark it '@',</text>
    <text x="540" y="190" font-size="12" fill="#e6edf3">recurse left and right on that row</text>
    <text x="540" y="212" font-size="12" fill="#e6edf3">beams that meet a '|' stop, so a</text>
    <text x="540" y="234" font-size="12" fill="#e6edf3">splitter is only counted once</text>
    <text x="540" y="256" font-size="13" fill="#f2cc60">→ 5 splits</text>
    <text x="540" y="290" font-size="14" fill="#d2a8ff">part 2 · dp over the marked board</text>
    <text x="540" y="312" font-size="12" fill="#e6edf3">dp[y][x] = timelines reaching a cell</text>
    <text x="540" y="334" font-size="12" fill="#e6edf3">from above if it is '|' or 'S'</text>
    <text x="540" y="356" font-size="12" fill="#e6edf3">+ from a '@' diagonally above</text>
    <text x="540" y="378" font-size="12" fill="#8b949e">(the side beams of a splitter)</text>
