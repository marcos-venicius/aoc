<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 474" width="960" height="474" role="img" aria-labelledby="t d">
  <title id="t">Which IDs the two regular expressions flag as invalid</title>
  <desc id="d">Part 1 only accepts numbers made of one block repeated exactly twice; part 2 accepts a block repeated two or more times. Colored boxes show the repeated block found by the back-reference.</desc>
  <rect x="1" y="1" width="958" height="472" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
