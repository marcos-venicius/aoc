    <text x="40" y="70" font-size="14" fill="#8b949e">\1 must repeat exactly what group 1 captured</text>
    <text x="40" y="118" font-size="13" fill="#8b949e">ID</text>
    <text x="330" y="118" font-size="13" fill="#58a6ff" xml:space="preserve">part 1:  ^(:?\d{1,})\1$</text>
    <text x="640" y="118" font-size="13" fill="#f2cc60" xml:space="preserve">part 2:  ^(:?\d{1,})\1+$</text>
