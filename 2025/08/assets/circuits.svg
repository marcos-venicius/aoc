<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 434" width="960" height="434" role="img" aria-labelledby="t d">
  <title id="t">Connecting the closest pairs of junction boxes with union-find</title>
  <desc id="d">Pairs are processed from shortest to longest distance. After the first 6 pairs the circuits have sizes 3, 3, 1 and 1. The 10th pair joins everything into a single circuit.</desc>
  <rect x="1" y="1" width="958" height="432" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="44" font-size="18" font-weight="700" fill="#e6edf3">Shortest pairs first, joined with union-find</text>
    <text x="40" y="70" font-size="14" fill="#8b949e">Kruskal-style: a pair whose boxes are already in the same circuit changes nothing</text>
    <line x1="86" y1="326" x2="158" y2="290" stroke="#3fb950" stroke-width="3" opacity="0.9"/>
    <circle cx="122.0" cy="308.0" r="9" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
    <text x="122.0" y="312.0" font-size="10" fill="#3fb950" text-anchor="middle">1</text>
    <line x1="158" y1="290" x2="122" y2="218" stroke="#3fb950" stroke-width="3" opacity="0.9"/>
    <circle cx="140.0" cy="254.0" r="9" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
    <text x="140.0" y="258.0" font-size="10" fill="#3fb950" text-anchor="middle">2</text>
    <line x1="338" y1="290" x2="374" y2="218" stroke="#3fb950" stroke-width="3" opacity="0.9"/>
    <circle cx="356.0" cy="254.0" r="9" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
    <text x="356.0" y="258.0" font-size="10" fill="#3fb950" text-anchor="middle">3</text>
    <line x1="374" y1="218" x2="302" y2="182" stroke="#3fb950" stroke-width="3" opacity="0.9"/>
    <circle cx="338.0" cy="200.0" r="9" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
    <text x="338.0" y="204.0" font-size="10" fill="#3fb950" text-anchor="middle">4</text>
    <line x1="86" y1="326" x2="122" y2="218" stroke="#ff7b72" stroke-width="2" stroke-dasharray="5 5" opacity="0.9"/>
    <circle cx="104.0" cy="272.0" r="9" fill="#0d1117" stroke="#ff7b72" stroke-width="1.5"/>
    <text x="104.0" y="276.0" font-size="10" fill="#ff7b72" text-anchor="middle">5</text>
    <line x1="338" y1="290" x2="302" y2="182" stroke="#ff7b72" stroke-width="2" stroke-dasharray="5 5" opacity="0.9"/>
    <circle cx="320.0" cy="236.0" r="9" fill="#0d1117" stroke="#ff7b72" stroke-width="1.5"/>
    <text x="320.0" y="240.0" font-size="10" fill="#ff7b72" text-anchor="middle">6</text>
    <line x1="518" y1="254" x2="482" y2="146" stroke="#d2a8ff" stroke-width="3" opacity="0.9"/>
    <circle cx="500.0" cy="200.0" r="9" fill="#0d1117" stroke="#d2a8ff" stroke-width="1.5"/>
    <text x="500.0" y="204.0" font-size="10" fill="#d2a8ff" text-anchor="middle">7</text>
    <line x1="374" y1="218" x2="482" y2="146" stroke="#d2a8ff" stroke-width="3" opacity="0.9"/>
    <circle cx="428.0" cy="182.0" r="9" fill="#0d1117" stroke="#d2a8ff" stroke-width="1.5"/>
    <text x="428.0" y="186.0" font-size="10" fill="#d2a8ff" text-anchor="middle">8</text>
    <line x1="374" y1="218" x2="518" y2="254" stroke="#ff7b72" stroke-width="2" stroke-dasharray="5 5" opacity="0.9"/>
    <circle cx="446.0" cy="236.0" r="9" fill="#0d1117" stroke="#ff7b72" stroke-width="1.5"/>
    <text x="446.0" y="240.0" font-size="10" fill="#ff7b72" text-anchor="middle">9</text>
    <line x1="158" y1="290" x2="338" y2="290" stroke="#f2cc60" stroke-width="3" opacity="0.9"/>
    <circle cx="248.0" cy="290.0" r="9" fill="#0d1117" stroke="#f2cc60" stroke-width="1.5"/>
    <text x="248.0" y="294.0" font-size="10" fill="#f2cc60" text-anchor="middle">10</text>
    <circle cx="86" cy="326" r="8" fill="#e6edf3"/>
    <text x="86" y="350" font-size="11" fill="#8b949e" text-anchor="middle">0</text>
    <circle cx="158" cy="290" r="8" fill="#e6edf3"/>
    <text x="158" y="314" font-size="11" fill="#8b949e" text-anchor="middle">1</text>
    <circle cx="122" cy="218" r="8" fill="#e6edf3"/>
    <text x="122" y="242" font-size="11" fill="#8b949e" text-anchor="middle">2</text>
    <circle cx="338" cy="290" r="8" fill="#e6edf3"/>
    <text x="338" y="314" font-size="11" fill="#8b949e" text-anchor="middle">3</text>
    <circle cx="374" cy="218" r="8" fill="#e6edf3"/>
    <text x="374" y="242" font-size="11" fill="#8b949e" text-anchor="middle">4</text>
    <circle cx="302" cy="182" r="8" fill="#e6edf3"/>
    <text x="302" y="206" font-size="11" fill="#8b949e" text-anchor="middle">5</text>
    <circle cx="518" cy="254" r="8" fill="#e6edf3"/>
    <text x="518" y="278" font-size="11" fill="#8b949e" text-anchor="middle">6</text>
    <circle cx="482" cy="146" r="8" fill="#e6edf3"/>
    <text x="482" y="170" font-size="11" fill="#8b949e" text-anchor="middle">7</text>
    <text x="50" y="408" font-size="12" fill="#8b949e">made-up points (z = 0 for the drawing) · edge label = rank by distance</text>
    <text x="600" y="112" font-size="12" fill="#8b949e">#</text>
    <text x="630" y="112" font-size="12" fill="#8b949e">pair</text>
    <text x="700" y="112" font-size="12" fill="#8b949e">union</text>
    <text x="770" y="112" font-size="12" fill="#8b949e">circuit sizes</text>
    <text x="600" y="138" font-size="13" fill="#3fb950">1</text>
    <text x="630" y="138" font-size="13" fill="#e6edf3">0–1</text>
    <text x="700" y="138" font-size="13" fill="#3fb950">merge</text>
    <text x="770" y="138" font-size="13" fill="#e6edf3">2,1,1,1,1,1,1</text>
    <text x="600" y="163" font-size="13" fill="#3fb950">2</text>
    <text x="630" y="163" font-size="13" fill="#e6edf3">1–2</text>
    <text x="700" y="163" font-size="13" fill="#3fb950">merge</text>
    <text x="770" y="163" font-size="13" fill="#e6edf3">3,1,1,1,1,1</text>
    <text x="600" y="188" font-size="13" fill="#3fb950">3</text>
    <text x="630" y="188" font-size="13" fill="#e6edf3">3–4</text>
    <text x="700" y="188" font-size="13" fill="#3fb950">merge</text>
    <text x="770" y="188" font-size="13" fill="#e6edf3">3,2,1,1,1</text>
    <text x="600" y="213" font-size="13" fill="#3fb950">4</text>
    <text x="630" y="213" font-size="13" fill="#e6edf3">4–5</text>
    <text x="700" y="213" font-size="13" fill="#3fb950">merge</text>
    <text x="770" y="213" font-size="13" fill="#e6edf3">3,3,1,1</text>
    <text x="600" y="238" font-size="13" fill="#ff7b72">5</text>
    <text x="630" y="238" font-size="13" fill="#e6edf3">0–2</text>
    <text x="700" y="238" font-size="13" fill="#ff7b72">same</text>
    <text x="770" y="238" font-size="13" fill="#e6edf3">3,3,1,1</text>
    <text x="600" y="263" font-size="13" fill="#ff7b72">6</text>
    <text x="630" y="263" font-size="13" fill="#e6edf3">3–5</text>
    <text x="700" y="263" font-size="13" fill="#ff7b72">same</text>
    <text x="770" y="263" font-size="13" fill="#e6edf3">3,3,1,1</text>
    <line x1="594" y1="271" x2="920" y2="271" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="600" y="288" font-size="13" fill="#d2a8ff">7</text>
    <text x="630" y="288" font-size="13" fill="#e6edf3">6–7</text>
    <text x="700" y="288" font-size="13" fill="#d2a8ff">merge</text>
    <text x="770" y="288" font-size="13" fill="#e6edf3">3,3,2</text>
    <text x="600" y="313" font-size="13" fill="#d2a8ff">8</text>
    <text x="630" y="313" font-size="13" fill="#e6edf3">4–7</text>
    <text x="700" y="313" font-size="13" fill="#d2a8ff">merge</text>
    <text x="770" y="313" font-size="13" fill="#e6edf3">5,3</text>
    <text x="600" y="338" font-size="13" fill="#ff7b72">9</text>
    <text x="630" y="338" font-size="13" fill="#e6edf3">4–6</text>
    <text x="700" y="338" font-size="13" fill="#ff7b72">same</text>
    <text x="770" y="338" font-size="13" fill="#e6edf3">5,3</text>
    <text x="600" y="363" font-size="13" fill="#f2cc60">10</text>
    <text x="630" y="363" font-size="13" fill="#e6edf3">1–3</text>
    <text x="700" y="363" font-size="13" fill="#f2cc60">merge</text>
    <text x="770" y="363" font-size="13" fill="#e6edf3">8</text>
    <text x="600" y="394" font-size="12" fill="#3fb950">after X = 6 pairs: 3 × 3 × 1 = 9</text>
    <text x="600" y="414" font-size="12" fill="#f2cc60">pair 10 makes 1 circuit: x 3 × 8 = 24</text>
  </g>
</svg>
