<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="960" height="350" role="img" aria-labelledby="t d">
  <title id="t">Row checksums for both parts on the example spreadsheets</title>
  <desc id="d">Part 1 adds max minus min of each row: 8 + 4 + 6 = 18. Part 2 adds the quotient of the only evenly dividing pair in each row: 4 + 3 + 2 = 9.</desc>
  <rect x="1" y="1" width="958" height="348" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="44" font-size="18" fill="#e6edf3" font-weight="700" xml:space="preserve">One number per row, then sum</text>
    <text x="40" y="70" font-size="14" fill="#8b949e" xml:space="preserve">part 1: max − min · part 2: the one pair where a / b is a whole number</text>
    <text x="60" y="112" font-size="14" fill="#e6edf3" font-weight="700" xml:space="preserve">Part 1 · max − min</text>
    <rect x="63" y="130" width="46" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="86.0" y="157" font-size="18" fill="#8b949e" text-anchor="middle" xml:space="preserve">5</text>
    <rect x="115" y="130" width="46" height="40" rx="6" fill="#161b22" stroke="#ff7b72" stroke-width="2"/>
    <text x="138.0" y="157" font-size="18" fill="#ff7b72" text-anchor="middle" font-weight="700" xml:space="preserve">1</text>
    <rect x="167" y="130" width="46" height="40" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="190.0" y="157" font-size="18" fill="#3fb950" text-anchor="middle" font-weight="700" xml:space="preserve">9</text>
    <rect x="219" y="130" width="46" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="242.0" y="157" font-size="18" fill="#8b949e" text-anchor="middle" xml:space="preserve">5</text>
    <text x="284" y="157" font-size="15" fill="#e6edf3" xml:space="preserve">9 − 1 = 8</text>
    <rect x="63" y="182" width="46" height="40" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="86.0" y="209" font-size="18" fill="#3fb950" text-anchor="middle" font-weight="700" xml:space="preserve">7</text>
    <rect x="115" y="182" width="46" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="138.0" y="209" font-size="18" fill="#8b949e" text-anchor="middle" xml:space="preserve">5</text>
    <rect x="167" y="182" width="46" height="40" rx="6" fill="#161b22" stroke="#ff7b72" stroke-width="2"/>
    <text x="190.0" y="209" font-size="18" fill="#ff7b72" text-anchor="middle" font-weight="700" xml:space="preserve">3</text>
    <text x="284" y="209" font-size="15" fill="#e6edf3" xml:space="preserve">7 − 3 = 4</text>
    <rect x="63" y="234" width="46" height="40" rx="6" fill="#161b22" stroke="#ff7b72" stroke-width="2"/>
    <text x="86.0" y="261" font-size="18" fill="#ff7b72" text-anchor="middle" font-weight="700" xml:space="preserve">2</text>
    <rect x="115" y="234" width="46" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="138.0" y="261" font-size="18" fill="#8b949e" text-anchor="middle" xml:space="preserve">4</text>
    <rect x="167" y="234" width="46" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="190.0" y="261" font-size="18" fill="#8b949e" text-anchor="middle" xml:space="preserve">6</text>
    <rect x="219" y="234" width="46" height="40" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="242.0" y="261" font-size="18" fill="#3fb950" text-anchor="middle" font-weight="700" xml:space="preserve">8</text>
    <text x="284" y="261" font-size="15" fill="#e6edf3" xml:space="preserve">8 − 2 = 6</text>
    <text x="60" y="316" font-size="16" fill="#f2cc60" font-weight="700" xml:space="preserve">checksum = 8 + 4 + 6 = 18</text>
    <text x="520" y="112" font-size="14" fill="#e6edf3" font-weight="700" xml:space="preserve">Part 2 · the evenly divisible pair</text>
    <rect x="523" y="130" width="46" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="546.0" y="157" font-size="18" fill="#8b949e" text-anchor="middle" xml:space="preserve">5</text>
    <rect x="575" y="130" width="46" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="598.0" y="157" font-size="18" fill="#8b949e" text-anchor="middle" xml:space="preserve">9</text>
    <rect x="627" y="130" width="46" height="40" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="650.0" y="157" font-size="18" fill="#58a6ff" text-anchor="middle" font-weight="700" xml:space="preserve">2</text>
    <rect x="679" y="130" width="46" height="40" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="702.0" y="157" font-size="18" fill="#3fb950" text-anchor="middle" font-weight="700" xml:space="preserve">8</text>
    <text x="744" y="157" font-size="15" fill="#e6edf3" xml:space="preserve">8 ÷ 2 = 4</text>
    <rect x="523" y="182" width="46" height="40" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="546.0" y="209" font-size="18" fill="#3fb950" text-anchor="middle" font-weight="700" xml:space="preserve">9</text>
    <rect x="575" y="182" width="46" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="598.0" y="209" font-size="18" fill="#8b949e" text-anchor="middle" xml:space="preserve">4</text>
    <rect x="627" y="182" width="46" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="650.0" y="209" font-size="18" fill="#8b949e" text-anchor="middle" xml:space="preserve">7</text>
    <rect x="679" y="182" width="46" height="40" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="702.0" y="209" font-size="18" fill="#58a6ff" text-anchor="middle" font-weight="700" xml:space="preserve">3</text>
    <text x="744" y="209" font-size="15" fill="#e6edf3" xml:space="preserve">9 ÷ 3 = 3</text>
    <rect x="523" y="234" width="46" height="40" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="546.0" y="261" font-size="18" fill="#58a6ff" text-anchor="middle" font-weight="700" xml:space="preserve">3</text>
    <rect x="575" y="234" width="46" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="598.0" y="261" font-size="18" fill="#8b949e" text-anchor="middle" xml:space="preserve">8</text>
    <rect x="627" y="234" width="46" height="40" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="650.0" y="261" font-size="18" fill="#3fb950" text-anchor="middle" font-weight="700" xml:space="preserve">6</text>
    <rect x="679" y="234" width="46" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="702.0" y="261" font-size="18" fill="#8b949e" text-anchor="middle" xml:space="preserve">5</text>
    <text x="744" y="261" font-size="15" fill="#e6edf3" xml:space="preserve">6 ÷ 3 = 2</text>
    <text x="520" y="316" font-size="16" fill="#f2cc60" font-weight="700" xml:space="preserve">sum = 4 + 3 + 2 = 9</text>
  </g>
</svg>
