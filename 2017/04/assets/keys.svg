<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" role="img" aria-labelledby="t d">
  <title id="t">Duplicate words versus duplicate anagrams</title>
  <desc id="d">Part 1 compares the number of words with the size of the set of words. Part 2 sorts the letters of every word, so anagrams like abcde and ecdab get the same key and collide in the set.</desc>
  <rect x="1" y="1" width="958" height="488" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="44" font-size="18" fill="#e6edf3" font-weight="700" xml:space="preserve">Same check, different key</text>
    <text x="40" y="70" font-size="14" fill="#8b949e" xml:space="preserve">part 1 key = the word · part 2 key = its letters sorted · a repeated key = invalid</text>
    <text x="40" y="112" font-size="14" fill="#f2cc60" font-weight="700" xml:space="preserve">Part 1 · len(row) == len(set(row))</text>
    <rect x="60" y="128" width="46" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="83.0" y="148" font-size="15" fill="#e6edf3" text-anchor="middle" xml:space="preserve">aa</text>
    <rect x="116" y="128" width="46" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="139.0" y="148" font-size="15" fill="#e6edf3" text-anchor="middle" xml:space="preserve">bb</text>
    <rect x="172" y="128" width="46" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="195.0" y="148" font-size="15" fill="#e6edf3" text-anchor="middle" xml:space="preserve">cc</text>
    <rect x="228" y="128" width="46" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="251.0" y="148" font-size="15" fill="#e6edf3" text-anchor="middle" xml:space="preserve">dd</text>
    <rect x="284" y="128" width="46" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="307.0" y="148" font-size="15" fill="#e6edf3" text-anchor="middle" xml:space="preserve">ee</text>
    <text x="900" y="148" font-size="14" fill="#3fb950" text-anchor="end" font-weight="700" xml:space="preserve">valid ✓</text>
    <rect x="60" y="170" width="46" height="30" rx="6" fill="#161b22" stroke="#ff7b72" stroke-width="2"/>
    <text x="83.0" y="190" font-size="15" fill="#ff7b72" text-anchor="middle" xml:space="preserve">aa</text>
    <rect x="116" y="170" width="46" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="139.0" y="190" font-size="15" fill="#e6edf3" text-anchor="middle" xml:space="preserve">bb</text>
    <rect x="172" y="170" width="46" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="195.0" y="190" font-size="15" fill="#e6edf3" text-anchor="middle" xml:space="preserve">cc</text>
    <rect x="228" y="170" width="46" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="251.0" y="190" font-size="15" fill="#e6edf3" text-anchor="middle" xml:space="preserve">dd</text>
    <rect x="284" y="170" width="46" height="30" rx="6" fill="#161b22" stroke="#ff7b72" stroke-width="2"/>
    <text x="307.0" y="190" font-size="15" fill="#ff7b72" text-anchor="middle" xml:space="preserve">aa</text>
    <text x="900" y="190" font-size="14" fill="#ff7b72" text-anchor="end" font-weight="700" xml:space="preserve">invalid ✗</text>
    <rect x="60" y="212" width="46" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="83.0" y="232" font-size="15" fill="#e6edf3" text-anchor="middle" xml:space="preserve">aa</text>
    <rect x="116" y="212" width="46" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="139.0" y="232" font-size="15" fill="#e6edf3" text-anchor="middle" xml:space="preserve">bb</text>
    <rect x="172" y="212" width="46" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="195.0" y="232" font-size="15" fill="#e6edf3" text-anchor="middle" xml:space="preserve">cc</text>
    <rect x="228" y="212" width="46" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="251.0" y="232" font-size="15" fill="#e6edf3" text-anchor="middle" xml:space="preserve">dd</text>
    <rect x="284" y="212" width="57" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="312.5" y="232" font-size="15" fill="#e6edf3" text-anchor="middle" xml:space="preserve">aaa</text>
    <text x="900" y="232" font-size="14" fill="#3fb950" text-anchor="end" font-weight="700" xml:space="preserve">valid ✓</text>
    <line x1="40" y1="268" x2="920" y2="268" stroke="#21262d" stroke-width="1"/>
    <text x="40" y="300" font-size="14" fill="#f2cc60" font-weight="700" xml:space="preserve">Part 2 · sorted letters as the key</text>
    <rect x="60" y="316" width="79" height="30" rx="6" fill="#161b22" stroke="#ff7b72" stroke-width="2"/>
    <text x="99.5" y="336" font-size="15" fill="#ff7b72" text-anchor="middle" xml:space="preserve">abcde</text>
    <text x="99.5" y="366" font-size="13" fill="#ff7b72" text-anchor="middle" xml:space="preserve">abcde</text>
    <rect x="149" y="316" width="57" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="177.5" y="336" font-size="15" fill="#e6edf3" text-anchor="middle" xml:space="preserve">xyz</text>
    <text x="177.5" y="366" font-size="13" fill="#d2a8ff" text-anchor="middle" xml:space="preserve">xyz</text>
    <rect x="216" y="316" width="79" height="30" rx="6" fill="#161b22" stroke="#ff7b72" stroke-width="2"/>
    <text x="255.5" y="336" font-size="15" fill="#ff7b72" text-anchor="middle" xml:space="preserve">ecdab</text>
    <text x="255.5" y="366" font-size="13" fill="#ff7b72" text-anchor="middle" xml:space="preserve">abcde</text>
    <text x="900" y="336" font-size="14" fill="#ff7b72" text-anchor="end" font-weight="700" xml:space="preserve">invalid ✗</text>
    <rect x="60" y="382" width="68" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="94.0" y="402" font-size="15" fill="#e6edf3" text-anchor="middle" xml:space="preserve">iiii</text>
    <text x="94.0" y="432" font-size="13" fill="#d2a8ff" text-anchor="middle" xml:space="preserve">iiii</text>
    <rect x="138" y="382" width="68" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="172.0" y="402" font-size="15" fill="#e6edf3" text-anchor="middle" xml:space="preserve">oiii</text>
    <text x="172.0" y="432" font-size="13" fill="#d2a8ff" text-anchor="middle" xml:space="preserve">iiio</text>
    <rect x="216" y="382" width="68" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="250.0" y="402" font-size="15" fill="#e6edf3" text-anchor="middle" xml:space="preserve">ooii</text>
    <text x="250.0" y="432" font-size="13" fill="#d2a8ff" text-anchor="middle" xml:space="preserve">iioo</text>
    <rect x="294" y="382" width="68" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="328.0" y="402" font-size="15" fill="#e6edf3" text-anchor="middle" xml:space="preserve">oooi</text>
    <text x="328.0" y="432" font-size="13" fill="#d2a8ff" text-anchor="middle" xml:space="preserve">iooo</text>
    <rect x="372" y="382" width="68" height="30" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="406.0" y="402" font-size="15" fill="#e6edf3" text-anchor="middle" xml:space="preserve">oooo</text>
    <text x="406.0" y="432" font-size="13" fill="#d2a8ff" text-anchor="middle" xml:space="preserve">oooo</text>
    <text x="900" y="402" font-size="14" fill="#3fb950" text-anchor="end" font-weight="700" xml:space="preserve">valid ✓</text>
    <text x="60" y="470" font-size="12" fill="#8b949e" xml:space="preserve">purple = sorted key written under each word</text>
  </g>
</svg>
