<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d">
  <title id="t">Redistributing the example banks 0 2 7 0 until a state repeats</title>
  <desc id="d">The fullest bank (ties go to the lowest index) is emptied and its blocks are dealt one by one to the following banks. After 5 cycles the state 2 4 1 2 appears for the second time; the loop between the two appearances has 4 cycles.</desc>
  <rect x="1" y="1" width="958" height="518" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="44" font-size="18" fill="#e6edf3" font-weight="700" xml:space="preserve">Empty the fullest bank, deal its blocks round-robin</text>
    <text x="40" y="70" font-size="14" fill="#8b949e" xml:space="preserve">ties go to the lowest index · the state is stored as a string key in a set</text>
    <text x="60" y="128" font-size="13" fill="#8b949e" xml:space="preserve">start</text>
    <rect x="173" y="104" width="54" height="38" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="200.0" y="130" font-size="18" fill="#e6edf3" text-anchor="middle" xml:space="preserve">0</text>
    <rect x="233" y="104" width="54" height="38" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="260.0" y="130" font-size="18" fill="#e6edf3" text-anchor="middle" xml:space="preserve">2</text>
    <rect x="293" y="104" width="54" height="38" rx="6" fill="#161b22" stroke="#f2cc60" stroke-width="2.5"/>
    <text x="320.0" y="130" font-size="18" fill="#f2cc60" text-anchor="middle" font-weight="700" xml:space="preserve">7</text>
    <rect x="353" y="104" width="54" height="38" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="380.0" y="130" font-size="18" fill="#e6edf3" text-anchor="middle" xml:space="preserve">0</text>
    <text x="440" y="128" font-size="13" fill="#8b949e" xml:space="preserve">&quot;0,2,7,0&quot;</text>
    <text x="560" y="128" font-size="12" fill="#f2cc60" xml:space="preserve">empty bank 2 (7) → +1 to 3,0,1,2,3,0,1</text>
    <text x="60" y="180" font-size="13" fill="#8b949e" xml:space="preserve">cycle 1</text>
    <rect x="173" y="156" width="54" height="38" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="2.5"/>
    <text x="200.0" y="182" font-size="18" fill="#d2a8ff" text-anchor="middle" font-weight="700" xml:space="preserve">2</text>
    <rect x="233" y="156" width="54" height="38" rx="6" fill="#161b22" stroke="#f2cc60" stroke-width="2.5"/>
    <text x="260.0" y="182" font-size="18" fill="#f2cc60" text-anchor="middle" font-weight="700" xml:space="preserve">4</text>
    <rect x="293" y="156" width="54" height="38" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="2.5"/>
    <text x="320.0" y="182" font-size="18" fill="#d2a8ff" text-anchor="middle" font-weight="700" xml:space="preserve">1</text>
    <rect x="353" y="156" width="54" height="38" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="2.5"/>
    <text x="380.0" y="182" font-size="18" fill="#d2a8ff" text-anchor="middle" font-weight="700" xml:space="preserve">2</text>
    <text x="440" y="180" font-size="13" fill="#d2a8ff" xml:space="preserve">&quot;2,4,1,2&quot;</text>
    <text x="560" y="180" font-size="12" fill="#f2cc60" xml:space="preserve">empty bank 1 (4) → +1 to 2,3,0,1</text>
    <text x="60" y="232" font-size="13" fill="#8b949e" xml:space="preserve">cycle 2</text>
    <rect x="173" y="208" width="54" height="38" rx="6" fill="#161b22" stroke="#f2cc60" stroke-width="2.5"/>
    <text x="200.0" y="234" font-size="18" fill="#f2cc60" text-anchor="middle" font-weight="700" xml:space="preserve">3</text>
    <rect x="233" y="208" width="54" height="38" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="260.0" y="234" font-size="18" fill="#e6edf3" text-anchor="middle" xml:space="preserve">1</text>
    <rect x="293" y="208" width="54" height="38" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="320.0" y="234" font-size="18" fill="#e6edf3" text-anchor="middle" xml:space="preserve">2</text>
    <rect x="353" y="208" width="54" height="38" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="380.0" y="234" font-size="18" fill="#e6edf3" text-anchor="middle" xml:space="preserve">3</text>
    <text x="440" y="232" font-size="13" fill="#8b949e" xml:space="preserve">&quot;3,1,2,3&quot;</text>
    <text x="560" y="232" font-size="12" fill="#f2cc60" xml:space="preserve">empty bank 0 (3) → +1 to 1,2,3</text>
    <text x="60" y="284" font-size="13" fill="#8b949e" xml:space="preserve">cycle 3</text>
    <rect x="173" y="260" width="54" height="38" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="200.0" y="286" font-size="18" fill="#e6edf3" text-anchor="middle" xml:space="preserve">0</text>
    <rect x="233" y="260" width="54" height="38" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="260.0" y="286" font-size="18" fill="#e6edf3" text-anchor="middle" xml:space="preserve">2</text>
    <rect x="293" y="260" width="54" height="38" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="320.0" y="286" font-size="18" fill="#e6edf3" text-anchor="middle" xml:space="preserve">3</text>
    <rect x="353" y="260" width="54" height="38" rx="6" fill="#161b22" stroke="#f2cc60" stroke-width="2.5"/>
    <text x="380.0" y="286" font-size="18" fill="#f2cc60" text-anchor="middle" font-weight="700" xml:space="preserve">4</text>
    <text x="440" y="284" font-size="13" fill="#8b949e" xml:space="preserve">&quot;0,2,3,4&quot;</text>
    <text x="560" y="284" font-size="12" fill="#f2cc60" xml:space="preserve">empty bank 3 (4) → +1 to 0,1,2,3</text>
    <text x="60" y="336" font-size="13" fill="#8b949e" xml:space="preserve">cycle 4</text>
    <rect x="173" y="312" width="54" height="38" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="200.0" y="338" font-size="18" fill="#e6edf3" text-anchor="middle" xml:space="preserve">1</text>
    <rect x="233" y="312" width="54" height="38" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="260.0" y="338" font-size="18" fill="#e6edf3" text-anchor="middle" xml:space="preserve">3</text>
    <rect x="293" y="312" width="54" height="38" rx="6" fill="#161b22" stroke="#f2cc60" stroke-width="2.5"/>
    <text x="320.0" y="338" font-size="18" fill="#f2cc60" text-anchor="middle" font-weight="700" xml:space="preserve">4</text>
    <rect x="353" y="312" width="54" height="38" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="380.0" y="338" font-size="18" fill="#e6edf3" text-anchor="middle" xml:space="preserve">1</text>
    <text x="440" y="336" font-size="13" fill="#8b949e" xml:space="preserve">&quot;1,3,4,1&quot;</text>
    <text x="560" y="336" font-size="12" fill="#f2cc60" xml:space="preserve">empty bank 2 (4) → +1 to 3,0,1,2</text>
    <text x="60" y="388" font-size="13" fill="#8b949e" xml:space="preserve">cycle 5</text>
    <rect x="173" y="364" width="54" height="38" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="2.5"/>
    <text x="200.0" y="390" font-size="18" fill="#d2a8ff" text-anchor="middle" font-weight="700" xml:space="preserve">2</text>
    <rect x="233" y="364" width="54" height="38" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="2.5"/>
    <text x="260.0" y="390" font-size="18" fill="#d2a8ff" text-anchor="middle" font-weight="700" xml:space="preserve">4</text>
    <rect x="293" y="364" width="54" height="38" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="2.5"/>
    <text x="320.0" y="390" font-size="18" fill="#d2a8ff" text-anchor="middle" font-weight="700" xml:space="preserve">1</text>
    <rect x="353" y="364" width="54" height="38" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="2.5"/>
    <text x="380.0" y="390" font-size="18" fill="#d2a8ff" text-anchor="middle" font-weight="700" xml:space="preserve">2</text>
    <text x="440" y="388" font-size="13" fill="#d2a8ff" xml:space="preserve">&quot;2,4,1,2&quot;</text>
    <text x="60" y="442" font-size="14" fill="#3fb950" font-weight="700" xml:space="preserve">part 1: &quot;2,4,1,2&quot; first seen after cycle 1, seen again after cycle 5 → 5 cycles</text>
    <text x="60" y="468" font-size="14" fill="#3fb950" font-weight="700" xml:space="preserve">part 2: the code resets the counter at that point and runs until &quot;2,4,1,2&quot; shows up again → 4</text>
  </g>
</svg>
