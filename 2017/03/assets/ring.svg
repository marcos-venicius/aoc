<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d">
  <title id="t">Locating square 12 on the spiral without walking it</title>
  <desc id="d">Square 12 is on ring k = 2, whose last square is 25 = (2k+1)^2. It is s = 13 steps back from that corner, which lands on the right side at offset -1 from the middle, so the distance is 2 + 1 = 3.</desc>
  <rect x="1" y="1" width="958" height="438" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="44" font-size="18" fill="#e6edf3" font-weight="700" xml:space="preserve">Part 1 · closed form from the ring</text>
    <text x="40" y="70" font-size="14" fill="#8b949e" xml:space="preserve">k = ceil((√N − 1) / 2) · M = (2k + 1)² · s = M − N · each side has t = 2k squares</text>
    <rect x="189" y="229" width="52" height="52" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="215.0" y="261.0" font-size="17" fill="#8b949e" text-anchor="middle" font-weight="700" xml:space="preserve">1</text>
    <rect x="247" y="229" width="52" height="52" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="273.0" y="261.0" font-size="17" fill="#8b949e" text-anchor="middle" xml:space="preserve">2</text>
    <rect x="247" y="171" width="52" height="52" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="273.0" y="203.0" font-size="17" fill="#8b949e" text-anchor="middle" xml:space="preserve">3</text>
    <rect x="189" y="171" width="52" height="52" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="215.0" y="203.0" font-size="17" fill="#8b949e" text-anchor="middle" xml:space="preserve">4</text>
    <rect x="131" y="171" width="52" height="52" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="157.0" y="203.0" font-size="17" fill="#8b949e" text-anchor="middle" xml:space="preserve">5</text>
    <rect x="131" y="229" width="52" height="52" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="157.0" y="261.0" font-size="17" fill="#8b949e" text-anchor="middle" xml:space="preserve">6</text>
    <rect x="131" y="287" width="52" height="52" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="157.0" y="319.0" font-size="17" fill="#8b949e" text-anchor="middle" xml:space="preserve">7</text>
    <rect x="189" y="287" width="52" height="52" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="215.0" y="319.0" font-size="17" fill="#8b949e" text-anchor="middle" xml:space="preserve">8</text>
    <rect x="247" y="287" width="52" height="52" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <text x="273.0" y="319.0" font-size="17" fill="#8b949e" text-anchor="middle" xml:space="preserve">9</text>
    <rect x="305" y="287" width="52" height="52" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="331.0" y="319.0" font-size="17" fill="#e6edf3" text-anchor="middle" xml:space="preserve">10</text>
    <rect x="305" y="229" width="52" height="52" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="331.0" y="261.0" font-size="17" fill="#e6edf3" text-anchor="middle" xml:space="preserve">11</text>
    <rect x="305" y="171" width="52" height="52" rx="8" fill="#161b22" stroke="#f2cc60" stroke-width="2.5"/>
    <text x="331.0" y="203.0" font-size="17" fill="#f2cc60" text-anchor="middle" font-weight="700" xml:space="preserve">12</text>
    <rect x="305" y="113" width="52" height="52" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="331.0" y="145.0" font-size="17" fill="#e6edf3" text-anchor="middle" xml:space="preserve">13</text>
    <rect x="247" y="113" width="52" height="52" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="273.0" y="145.0" font-size="17" fill="#e6edf3" text-anchor="middle" xml:space="preserve">14</text>
    <rect x="189" y="113" width="52" height="52" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="215.0" y="145.0" font-size="17" fill="#e6edf3" text-anchor="middle" xml:space="preserve">15</text>
    <rect x="131" y="113" width="52" height="52" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="157.0" y="145.0" font-size="17" fill="#e6edf3" text-anchor="middle" xml:space="preserve">16</text>
    <rect x="73" y="113" width="52" height="52" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="99.0" y="145.0" font-size="17" fill="#e6edf3" text-anchor="middle" xml:space="preserve">17</text>
    <rect x="73" y="171" width="52" height="52" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="99.0" y="203.0" font-size="17" fill="#e6edf3" text-anchor="middle" xml:space="preserve">18</text>
    <rect x="73" y="229" width="52" height="52" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="99.0" y="261.0" font-size="17" fill="#e6edf3" text-anchor="middle" xml:space="preserve">19</text>
    <rect x="73" y="287" width="52" height="52" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="99.0" y="319.0" font-size="17" fill="#e6edf3" text-anchor="middle" xml:space="preserve">20</text>
    <rect x="73" y="345" width="52" height="52" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="99.0" y="377.0" font-size="17" fill="#e6edf3" text-anchor="middle" xml:space="preserve">21</text>
    <rect x="131" y="345" width="52" height="52" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="157.0" y="377.0" font-size="17" fill="#e6edf3" text-anchor="middle" xml:space="preserve">22</text>
    <rect x="189" y="345" width="52" height="52" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="215.0" y="377.0" font-size="17" fill="#e6edf3" text-anchor="middle" xml:space="preserve">23</text>
    <rect x="247" y="345" width="52" height="52" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="273.0" y="377.0" font-size="17" fill="#e6edf3" text-anchor="middle" xml:space="preserve">24</text>
    <rect x="305" y="345" width="52" height="52" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2.5"/>
    <text x="331.0" y="377.0" font-size="17" fill="#3fb950" text-anchor="middle" font-weight="700" xml:space="preserve">25</text>
    <polyline points="331.0,197.0 215.0,197.0 215.0,255.0" fill="none" stroke="#f2cc60" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5" opacity="0.8"/>
    <text x="420" y="128" font-size="14" fill="#e6edf3" xml:space="preserve">N = 12</text>
    <text x="420" y="164" font-size="14" fill="#58a6ff" xml:space="preserve">k = ceil((√12 − 1) / 2) = 2      ring 2 (blue)</text>
    <text x="420" y="200" font-size="14" fill="#8b949e" xml:space="preserve">t = 2k = 4 squares per side</text>
    <text x="420" y="236" font-size="14" fill="#3fb950" xml:space="preserve">M = (t + 1)² = 25      last square of the ring</text>
    <text x="420" y="272" font-size="14" fill="#e6edf3" xml:space="preserve">s = M − N = 13 steps back from 25</text>
    <text x="420" y="308" font-size="14" fill="#e6edf3" xml:space="preserve">s ≥ 3t → right side: x = k, y = −k + (s − 3t) = −1</text>
    <text x="420" y="344" font-size="14" fill="#f2cc60" font-weight="700" xml:space="preserve">distance = |x| + |y| = 2 + 1 = 3</text>
    <text x="420" y="380" font-size="12" fill="#8b949e" xml:space="preserve">four if-branches pick the side (s &lt; t, &lt; 2t, &lt; 3t, else)</text>
  </g>
</svg>
