<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">Parallel scan in ordered chunks</title>
  <desc id="d">Indices are split into chunks of 500000 that a multiprocessing pool hashes in parallel. imap returns the chunks in order, so hits are consumed in index order and fill the two passwords.</desc>
  <rect x="1" y="1" width="958" height="418" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="44" font-size="18" fill="#e6edf3" font-weight="700" xml:space="preserve">Chunks of 500 000 indices, hashed in parallel, consumed in order</text>
    <text x="40" y="70" font-size="14" fill="#8b949e" xml:space="preserve">pool.imap keeps chunk order, which both passwords depend on · example door id &quot;abc&quot;</text>
    <rect x="62" y="110" width="70" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="97.0" y="128" font-size="12" fill="#8b949e" text-anchor="middle" xml:space="preserve">#0</text>
    <text x="97.0" y="143" font-size="11" fill="#8b949e" text-anchor="middle" xml:space="preserve">0M</text>
    <rect x="136" y="110" width="70" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="171.0" y="128" font-size="12" fill="#8b949e" text-anchor="middle" xml:space="preserve">#1</text>
    <text x="171.0" y="143" font-size="11" fill="#8b949e" text-anchor="middle" xml:space="preserve">0.5M</text>
    <rect x="210" y="110" width="70" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="245.0" y="128" font-size="12" fill="#8b949e" text-anchor="middle" xml:space="preserve">#2</text>
    <text x="245.0" y="143" font-size="11" fill="#8b949e" text-anchor="middle" xml:space="preserve">1M</text>
    <rect x="284" y="110" width="70" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="319.0" y="128" font-size="12" fill="#8b949e" text-anchor="middle" xml:space="preserve">#3</text>
    <text x="319.0" y="143" font-size="11" fill="#8b949e" text-anchor="middle" xml:space="preserve">1.5M</text>
    <rect x="358" y="110" width="70" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="393.0" y="128" font-size="12" fill="#8b949e" text-anchor="middle" xml:space="preserve">#4</text>
    <text x="393.0" y="143" font-size="11" fill="#8b949e" text-anchor="middle" xml:space="preserve">2M</text>
    <rect x="432" y="110" width="70" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="467.0" y="128" font-size="12" fill="#8b949e" text-anchor="middle" xml:space="preserve">#5</text>
    <text x="467.0" y="143" font-size="11" fill="#8b949e" text-anchor="middle" xml:space="preserve">2.5M</text>
    <rect x="506" y="110" width="70" height="40" rx="6" fill="#161b22" stroke="#f2cc60" stroke-width="2"/>
    <text x="541.0" y="128" font-size="12" fill="#e6edf3" text-anchor="middle" xml:space="preserve">#6</text>
    <text x="541.0" y="143" font-size="11" fill="#8b949e" text-anchor="middle" xml:space="preserve">3M</text>
    <rect x="580" y="110" width="70" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="615.0" y="128" font-size="12" fill="#8b949e" text-anchor="middle" xml:space="preserve">#7</text>
    <text x="615.0" y="143" font-size="11" fill="#8b949e" text-anchor="middle" xml:space="preserve">3.5M</text>
    <rect x="654" y="110" width="70" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="689.0" y="128" font-size="12" fill="#8b949e" text-anchor="middle" xml:space="preserve">#8</text>
    <text x="689.0" y="143" font-size="11" fill="#8b949e" text-anchor="middle" xml:space="preserve">4M</text>
    <rect x="728" y="110" width="70" height="40" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="763.0" y="128" font-size="12" fill="#8b949e" text-anchor="middle" xml:space="preserve">#9</text>
    <text x="763.0" y="143" font-size="11" fill="#8b949e" text-anchor="middle" xml:space="preserve">4.5M</text>
    <rect x="802" y="110" width="70" height="40" rx="6" fill="#161b22" stroke="#f2cc60" stroke-width="2"/>
    <text x="837.0" y="128" font-size="12" fill="#e6edf3" text-anchor="middle" xml:space="preserve">#10</text>
    <text x="837.0" y="143" font-size="11" fill="#8b949e" text-anchor="middle" xml:space="preserve">5M</text>
    <text x="880" y="136" font-size="18" fill="#8b949e" xml:space="preserve">…</text>
    <text x="60" y="176" font-size="12" fill="#8b949e" xml:space="preserve">each chunk: base = md5(door); h = base.copy(); h.update(b&quot;%d&quot; % index)</text>
    <text x="60" y="230" font-size="12" fill="#8b949e" xml:space="preserve">hit index</text>
    <text x="240" y="230" font-size="12" fill="#8b949e" xml:space="preserve">6th</text>
    <text x="300" y="230" font-size="12" fill="#8b949e" xml:space="preserve">7th</text>
    <text x="370" y="230" font-size="12" fill="#8b949e" xml:space="preserve">part 1 (append)</text>
    <text x="580" y="230" font-size="12" fill="#8b949e" xml:space="preserve">part 2 (slot[6th] = 7th)</text>
    <text x="60" y="260" font-size="15" fill="#f2cc60" xml:space="preserve">3231929</text>
    <text x="180" y="260" font-size="12" fill="#8b949e" xml:space="preserve">#6</text>
    <text x="250" y="260" font-size="15" fill="#f2cc60" text-anchor="middle" xml:space="preserve">1</text>
    <text x="310" y="260" font-size="15" fill="#d2a8ff" text-anchor="middle" xml:space="preserve">5</text>
    <text x="370" y="260" font-size="15" fill="#3fb950" xml:space="preserve" letter-spacing="2">1_______</text>
    <text x="580" y="260" font-size="15" fill="#58a6ff" xml:space="preserve" letter-spacing="2">_5______</text>
    <text x="720" y="260" font-size="12" fill="#3fb950" xml:space="preserve">slot 1</text>
    <text x="60" y="296" font-size="15" fill="#f2cc60" xml:space="preserve">5017308</text>
    <text x="180" y="296" font-size="12" fill="#8b949e" xml:space="preserve">#10</text>
    <text x="250" y="296" font-size="15" fill="#f2cc60" text-anchor="middle" xml:space="preserve">8</text>
    <text x="310" y="296" font-size="15" fill="#d2a8ff" text-anchor="middle" xml:space="preserve">f</text>
    <text x="370" y="296" font-size="15" fill="#3fb950" xml:space="preserve" letter-spacing="2">18______</text>
    <text x="580" y="296" font-size="15" fill="#58a6ff" xml:space="preserve" letter-spacing="2">_5______</text>
    <text x="720" y="296" font-size="12" fill="#ff7b72" xml:space="preserve">ignored: slot ≥ 8</text>
    <text x="60" y="332" font-size="15" fill="#f2cc60" xml:space="preserve">5357525</text>
    <text x="180" y="332" font-size="12" fill="#8b949e" xml:space="preserve">#10</text>
    <text x="250" y="332" font-size="15" fill="#f2cc60" text-anchor="middle" xml:space="preserve">4</text>
    <text x="310" y="332" font-size="15" fill="#d2a8ff" text-anchor="middle" xml:space="preserve">e</text>
    <text x="370" y="332" font-size="15" fill="#3fb950" xml:space="preserve" letter-spacing="2">184_____</text>
    <text x="580" y="332" font-size="15" fill="#58a6ff" xml:space="preserve" letter-spacing="2">_5__e___</text>
    <text x="720" y="332" font-size="12" fill="#3fb950" xml:space="preserve">slot 4</text>
    <text x="60" y="374" font-size="12" fill="#8b949e" xml:space="preserve">… the loop stops once part 1 has 8 characters and all 8 slots of part 2 are filled</text>
  </g>
</svg>
