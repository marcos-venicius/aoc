<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="t d">
  <title id="t">Which bytes of the MD5 digest the code looks at</title>
  <desc id="d">The digest of abc3231929 starts with five zero hex digits: bytes 0 and 1 are zero and byte 2 is at most 0x0f. Byte 2 then is the sixth hex digit and the high nibble of byte 3 is the seventh.</desc>
  <rect x="1" y="1" width="958" height="358" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="44" font-size="18" fill="#e6edf3" font-weight="700" xml:space="preserve">Reading the digest as bytes, not as a hex string</text>
    <text x="40" y="70" font-size="14" fill="#8b949e" xml:space="preserve">md5(&quot;abc&quot; + &quot;3231929&quot;) · five leading zero hex digits = d[0] == 0, d[1] == 0, d[2] &lt;= 0x0f</text>
    <rect x="68.0" y="130" width="96" height="64" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="116.0" y="172" font-size="26" fill="#3fb950" text-anchor="middle" font-weight="700" xml:space="preserve">00</text>
    <text x="116.0" y="120" font-size="12" fill="#8b949e" text-anchor="middle" xml:space="preserve">d[0]</text>
    <rect x="172.0" y="130" width="96" height="64" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="220.0" y="172" font-size="26" fill="#3fb950" text-anchor="middle" font-weight="700" xml:space="preserve">00</text>
    <text x="220.0" y="120" font-size="12" fill="#8b949e" text-anchor="middle" xml:space="preserve">d[1]</text>
    <rect x="276.0" y="130" width="96" height="64" rx="8" fill="#161b22" stroke="#f2cc60" stroke-width="2"/>
    <text x="312.0" y="172" font-size="26" fill="#3fb950" text-anchor="middle" font-weight="700" xml:space="preserve">0</text>
    <text x="336.0" y="172" font-size="26" fill="#f2cc60" text-anchor="middle" font-weight="700" xml:space="preserve">1</text>
    <text x="324.0" y="120" font-size="12" fill="#8b949e" text-anchor="middle" xml:space="preserve">d[2]</text>
    <rect x="380.0" y="130" width="96" height="64" rx="8" fill="#161b22" stroke="#d2a8ff" stroke-width="2"/>
    <text x="416.0" y="172" font-size="26" fill="#d2a8ff" text-anchor="middle" font-weight="700" xml:space="preserve">5</text>
    <text x="440.0" y="172" font-size="26" fill="#8b949e" text-anchor="middle" xml:space="preserve">5</text>
    <text x="428.0" y="120" font-size="12" fill="#8b949e" text-anchor="middle" xml:space="preserve">d[3]</text>
    <rect x="484.0" y="130" width="96" height="64" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="532.0" y="172" font-size="26" fill="#8b949e" text-anchor="middle" xml:space="preserve">f8</text>
    <text x="532.0" y="120" font-size="12" fill="#8b949e" text-anchor="middle" xml:space="preserve">d[4]</text>
    <rect x="588.0" y="130" width="96" height="64" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="636.0" y="172" font-size="26" fill="#8b949e" text-anchor="middle" xml:space="preserve">10</text>
    <text x="636.0" y="120" font-size="12" fill="#8b949e" text-anchor="middle" xml:space="preserve">d[5]</text>
    <rect x="692.0" y="130" width="96" height="64" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="740.0" y="172" font-size="26" fill="#8b949e" text-anchor="middle" xml:space="preserve">5d</text>
    <text x="740.0" y="120" font-size="12" fill="#8b949e" text-anchor="middle" xml:space="preserve">d[6]</text>
    <rect x="796.0" y="130" width="96" height="64" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="844.0" y="172" font-size="26" fill="#8b949e" text-anchor="middle" xml:space="preserve">ff</text>
    <text x="844.0" y="120" font-size="12" fill="#8b949e" text-anchor="middle" xml:space="preserve">d[7]</text>
    <text x="896.0" y="172" font-size="26" fill="#8b949e" xml:space="preserve">…</text>
    <path d="M72.0 206V216H318.0V206" fill="none" stroke="#3fb950" stroke-width="2"/>
    <text x="195.0" y="238" font-size="14" fill="#3fb950" text-anchor="middle" font-weight="700" xml:space="preserve">00000</text>
    <text x="195.0" y="258" font-size="12" fill="#8b949e" text-anchor="middle" xml:space="preserve">5 zero hex digits</text>
    <path d="M326.0 206V216H368.0V206" fill="none" stroke="#f2cc60" stroke-width="2"/>
    <text x="347.0" y="238" font-size="14" fill="#f2cc60" text-anchor="middle" font-weight="700" xml:space="preserve">6th = d[2]</text>
    <text x="347.0" y="258" font-size="12" fill="#8b949e" text-anchor="middle" xml:space="preserve">= 1</text>
    <path d="M384.0 206V216H426.0V206" fill="none" stroke="#d2a8ff" stroke-width="2"/>
    <text x="405.0" y="238" font-size="14" fill="#d2a8ff" text-anchor="middle" font-weight="700" xml:space="preserve"></text>
    <text x="405.0" y="258" font-size="12" fill="#8b949e" text-anchor="middle" xml:space="preserve"></text>
    <text x="406.0" y="238" font-size="14" fill="#d2a8ff" font-weight="700" xml:space="preserve">7th = d[3] &gt;&gt; 4</text>
    <text x="406.0" y="258" font-size="12" fill="#8b949e" xml:space="preserve">= 5</text>
    <text x="480" y="300" font-size="13" fill="#e6edf3" text-anchor="middle" xml:space="preserve">part 1 appends the 6th digit (1) · part 2 puts the 7th digit (5) at position 6th = 1</text>
    <text x="480" y="326" font-size="12" fill="#8b949e" text-anchor="middle" xml:space="preserve">checking raw bytes avoids building the 32-character hex string for millions of misses</text>
  </g>
</svg>
