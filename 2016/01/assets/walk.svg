<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d">
  <title id="t">Walking the example R8, R4, R4, R8 on the city grid</title>
  <desc id="d">Starting at the origin facing north, the walk turns right four times. Part 1 is the Manhattan distance of the final block; part 2 is the first block visited twice, at 4 blocks east of the start.</desc>
  <rect x="1" y="1" width="958" height="468" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="44" font-size="18" fill="#e6edf3" font-weight="700" xml:space="preserve">Walking R8, R4, R4, R8 block by block</text>
    <text x="40" y="70" font-size="14" fill="#8b949e" xml:space="preserve">turn first, then walk · part 1 = |x|+|y| at the end · part 2 = first block seen twice</text>
    <line x1="70" y1="100" x2="70" y2="430" stroke="#21262d" stroke-width="1"/>
    <line x1="100" y1="100" x2="100" y2="430" stroke="#21262d" stroke-width="1"/>
    <line x1="130" y1="100" x2="130" y2="430" stroke="#21262d" stroke-width="1"/>
    <line x1="160" y1="100" x2="160" y2="430" stroke="#21262d" stroke-width="1"/>
    <line x1="190" y1="100" x2="190" y2="430" stroke="#21262d" stroke-width="1"/>
    <line x1="220" y1="100" x2="220" y2="430" stroke="#21262d" stroke-width="1"/>
    <line x1="250" y1="100" x2="250" y2="430" stroke="#21262d" stroke-width="1"/>
    <line x1="280" y1="100" x2="280" y2="430" stroke="#21262d" stroke-width="1"/>
    <line x1="310" y1="100" x2="310" y2="430" stroke="#21262d" stroke-width="1"/>
    <line x1="340" y1="100" x2="340" y2="430" stroke="#21262d" stroke-width="1"/>
    <line x1="370" y1="100" x2="370" y2="430" stroke="#21262d" stroke-width="1"/>
    <line x1="400" y1="100" x2="400" y2="430" stroke="#21262d" stroke-width="1"/>
    <line x1="70" y1="100" x2="400" y2="100" stroke="#21262d" stroke-width="1"/>
    <line x1="70" y1="130" x2="400" y2="130" stroke="#21262d" stroke-width="1"/>
    <line x1="70" y1="160" x2="400" y2="160" stroke="#21262d" stroke-width="1"/>
    <line x1="70" y1="190" x2="400" y2="190" stroke="#21262d" stroke-width="1"/>
    <line x1="70" y1="220" x2="400" y2="220" stroke="#21262d" stroke-width="1"/>
    <line x1="70" y1="250" x2="400" y2="250" stroke="#21262d" stroke-width="1"/>
    <line x1="70" y1="280" x2="400" y2="280" stroke="#21262d" stroke-width="1"/>
    <line x1="70" y1="310" x2="400" y2="310" stroke="#21262d" stroke-width="1"/>
    <line x1="70" y1="340" x2="400" y2="340" stroke="#21262d" stroke-width="1"/>
    <line x1="70" y1="370" x2="400" y2="370" stroke="#21262d" stroke-width="1"/>
    <line x1="70" y1="400" x2="400" y2="400" stroke="#21262d" stroke-width="1"/>
    <line x1="70" y1="430" x2="400" y2="430" stroke="#21262d" stroke-width="1"/>
    <polyline points="115.0,265.0 355.0,265.0" fill="none" stroke="#3fb950" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="355.0,265.0 355.0,385.0" fill="none" stroke="#58a6ff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="355.0,385.0 235.0,385.0" fill="none" stroke="#d2a8ff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <polyline points="235.0,385.0 235.0,145.0" fill="none" stroke="#f2cc60" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="145.0" cy="265.0" r="3" fill="#3fb950"/>
    <circle cx="175.0" cy="265.0" r="3" fill="#3fb950"/>
    <circle cx="205.0" cy="265.0" r="3" fill="#3fb950"/>
    <circle cx="235.0" cy="265.0" r="3" fill="#3fb950"/>
    <circle cx="265.0" cy="265.0" r="3" fill="#3fb950"/>
    <circle cx="295.0" cy="265.0" r="3" fill="#3fb950"/>
    <circle cx="325.0" cy="265.0" r="3" fill="#3fb950"/>
    <circle cx="355.0" cy="265.0" r="3" fill="#3fb950"/>
    <circle cx="355.0" cy="295.0" r="3" fill="#58a6ff"/>
    <circle cx="355.0" cy="325.0" r="3" fill="#58a6ff"/>
    <circle cx="355.0" cy="355.0" r="3" fill="#58a6ff"/>
    <circle cx="355.0" cy="385.0" r="3" fill="#58a6ff"/>
    <circle cx="325.0" cy="385.0" r="3" fill="#d2a8ff"/>
    <circle cx="295.0" cy="385.0" r="3" fill="#d2a8ff"/>
    <circle cx="265.0" cy="385.0" r="3" fill="#d2a8ff"/>
    <circle cx="235.0" cy="385.0" r="3" fill="#d2a8ff"/>
    <circle cx="235.0" cy="355.0" r="3" fill="#f2cc60"/>
    <circle cx="235.0" cy="325.0" r="3" fill="#f2cc60"/>
    <circle cx="235.0" cy="295.0" r="3" fill="#f2cc60"/>
    <circle cx="235.0" cy="265.0" r="3" fill="#f2cc60"/>
    <circle cx="235.0" cy="235.0" r="3" fill="#f2cc60"/>
    <circle cx="235.0" cy="205.0" r="3" fill="#f2cc60"/>
    <circle cx="235.0" cy="175.0" r="3" fill="#f2cc60"/>
    <circle cx="235.0" cy="145.0" r="3" fill="#f2cc60"/>
    <circle cx="115.0" cy="265.0" r="8" fill="#0d1117" stroke="#e6edf3" stroke-width="3"/>
    <text x="103.0" y="270.0" font-size="12" fill="#e6edf3" text-anchor="end" xml:space="preserve">start</text>
    <circle cx="235.0" cy="265.0" r="11" fill="none" stroke="#ff7b72" stroke-width="3"/>
    <text x="243.0" y="249.0" font-size="12" fill="#ff7b72" xml:space="preserve">(4,0) seen twice ★</text>
    <circle cx="235.0" cy="145.0" r="8" fill="#f2cc60"/>
    <text x="249.0" y="150.0" font-size="12" fill="#f2cc60" xml:space="preserve">end (4,−4)</text>
    <text x="235.0" y="454" font-size="12" fill="#8b949e" text-anchor="middle" xml:space="preserve">y grows southwards, like in the code</text>
    <text x="480" y="120" font-size="15" fill="#e6edf3" font-weight="700" xml:space="preserve">Heading as a vector</text>
    <text x="480" y="146" font-size="13" fill="#8b949e" xml:space="preserve">N (0,−1) → E (1,0) → S (0,1) → W (−1,0)</text>
    <text x="480" y="168" font-size="13" fill="#8b949e" xml:space="preserve">R steps right in that cycle, L steps left</text>
    <text x="480" y="206" font-size="15" fill="#e6edf3" font-weight="700" xml:space="preserve">Moves</text>
    <rect x="480" y="216" width="14" height="14" rx="3" fill="#3fb950"/>
    <text x="504" y="228" font-size="13" fill="#e6edf3" xml:space="preserve">R8 → east  to (8,0)</text>
    <rect x="480" y="244" width="14" height="14" rx="3" fill="#58a6ff"/>
    <text x="504" y="256" font-size="13" fill="#e6edf3" xml:space="preserve">R4 → south  to (8,4)</text>
    <rect x="480" y="272" width="14" height="14" rx="3" fill="#d2a8ff"/>
    <text x="504" y="284" font-size="13" fill="#e6edf3" xml:space="preserve">R4 → west  to (4,4)</text>
    <rect x="480" y="300" width="14" height="14" rx="3" fill="#f2cc60"/>
    <text x="504" y="312" font-size="13" fill="#e6edf3" xml:space="preserve">R8 → north  to (4,-4)</text>
    <text x="480" y="340" font-size="13" fill="#f2cc60" xml:space="preserve">Part 1  end (4,−4) → |4|+|−4| = 8</text>
    <text x="480" y="366" font-size="13" fill="#ff7b72" xml:space="preserve">Part 2  walk one block at a time and keep a</text>
    <text x="480" y="386" font-size="13" fill="#ff7b72" xml:space="preserve">        set of visited blocks: (4,0) → 4</text>
    <text x="480" y="420" font-size="12" fill="#8b949e" xml:space="preserve">(for the official example R5, L5, R5, R3</text>
    <text x="480" y="438" font-size="12" fill="#8b949e" xml:space="preserve"> the end is 12 blocks away)</text>
  </g>
</svg>
