    <text x="480" y="504" font-size="13" fill="#8b949e" text-anchor="middle" xml:space="preserve">test.txt: (27x12)(20x12)(13x14)(7x10)(1x12)A → 1 × 12 × 10 × 14 × 12 × 12 = 241920</text>
