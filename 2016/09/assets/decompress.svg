    <text x="512.0" y="345" font-size="18" fill="#8b949e" text-anchor="middle" xml:space="preserve">x</text>
    <rect x="529.0" y="320" width="30" height="36" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="544.0" y="345" font-size="18" fill="#8b949e" text-anchor="middle" xml:space="preserve">3</text>
    <rect x="561.0" y="320" width="30" height="36" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="576.0" y="345" font-size="18" fill="#8b949e" text-anchor="middle" xml:space="preserve">)</text>
    <rect x="593.0" y="320" width="30" height="36" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="608.0" y="345" font-size="18" fill="#e6edf3" text-anchor="middle" xml:space="preserve">A</text>
    <rect x="625.0" y="320" width="30" height="36" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
