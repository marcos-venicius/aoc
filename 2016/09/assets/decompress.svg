<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d">
  <title id="t">Counting the decompressed length of X(8x2)(3x3)ABCY in both versions</title>
  <desc id="d">Part 1 adds length times repeat for a marker and jumps over its data. Part 2 recurses into the marker data and multiplies the inner count by the repeat, giving 18 and 20 respectively.</desc>
  <rect x="1" y="1" width="958" height="538" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="44" font-size="18" fill="#e6edf3" font-weight="700" xml:space="preserve">Count, never expand</text>
    <text x="40" y="70" font-size="14" fill="#8b949e" xml:space="preserve">example X(8x2)(3x3)ABCY · only lengths are computed, the text is never built</text>
    <text x="40" y="114" font-size="14" fill="#f2cc60" font-weight="700" xml:space="preserve">Part 1 · markers inside a marker’s data are just text</text>
