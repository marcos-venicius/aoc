    <rect x="465.0" y="320" width="30" height="36" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="480.0" y="345" font-size="18" fill="#8b949e" text-anchor="middle" xml:space="preserve">3</text>
