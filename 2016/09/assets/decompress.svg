    <text x="480" y="232" font-size="16" fill="#f2cc60" text-anchor="middle" font-weight="700" xml:space="preserve">1 + 16 + 1 = 18</text>
    <line x1="40" y1="264" x2="920" y2="264" stroke="#21262d" stroke-width="1"/>
    <text x="40" y="306" font-size="14" fill="#f2cc60" font-weight="700" xml:space="preserve">Part 2 · recurse into the data and multiply</text>
