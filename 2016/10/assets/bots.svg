  <title id="t">Chips flowing through the example bots</title>
  <desc id="d">Values 5 and 2 reach bot 2, which compares them and passes 2 to bot 1 and 5 to bot 0. Bot 1 passes 2 to output 1 and 3 to bot 0. Bot 0 passes 3 to output 2 and 5 to output 0.</desc>
