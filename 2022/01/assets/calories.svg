<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" role="img" aria-labelledby="t d">
  <title id="t">Calories per elf in the example, then sorted</title>
  <desc id="d">Each elf total is the sum of its lines; sorting the totals in descending order gives part 1 as the first value and part 2 as the sum of the first three.</desc>
  <rect x="1" y="1" width="958" height="408" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="44" font-size="18" font-weight="700" fill="#e6edf3">Sum per elf, sort, take the top</text>
    <text x="40" y="70" font-size="14" fill="#8b949e">a blank line starts a new elf · sorting descending puts the answers at the front</text>
    <text x="60" y="108" font-size="13" fill="#8b949e">input order: one bar per elf, one block per line</text>
    <line x1="60" y1="340" x2="450" y2="340" stroke="#30363d" stroke-width="2"/>
    <rect x="80" y="332.1" width="48" height="5.9" rx="3" fill="#58a6ff" opacity="0.35"/>
    <rect x="80" y="316.2" width="48" height="13.8" rx="3" fill="#58a6ff" opacity="0.5"/>
    <rect x="80" y="292.5" width="48" height="21.8" rx="3" fill="#58a6ff" opacity="0.35"/>
    <text x="104" y="284.5" font-size="13" fill="#e6edf3" text-anchor="middle">6000</text>
    <text x="104" y="362" font-size="12" fill="#8b949e" text-anchor="middle">elf 1</text>
    <rect x="156" y="308.3" width="48" height="29.7" rx="3" fill="#58a6ff" opacity="0.35"/>
    <text x="180" y="300.3" font-size="13" fill="#e6edf3" text-anchor="middle">4000</text>
    <text x="180" y="362" font-size="12" fill="#8b949e" text-anchor="middle">elf 2</text>
    <rect x="232" y="300.4" width="48" height="37.6" rx="3" fill="#58a6ff" opacity="0.35"/>
    <rect x="232" y="252.9" width="48" height="45.5" rx="3" fill="#58a6ff" opacity="0.5"/>
    <text x="256" y="244.9" font-size="13" fill="#e6edf3" text-anchor="middle">11000</text>
    <text x="256" y="362" font-size="12" fill="#8b949e" text-anchor="middle">elf 3</text>
    <rect x="308" y="284.6" width="48" height="53.4" rx="3" fill="#58a6ff" opacity="0.35"/>
    <rect x="308" y="221.2" width="48" height="61.3" rx="3" fill="#58a6ff" opacity="0.5"/>
    <rect x="308" y="150.0" width="48" height="69.2" rx="3" fill="#58a6ff" opacity="0.35"/>
    <text x="332" y="142.0" font-size="13" fill="#e6edf3" text-anchor="middle">24000</text>
    <text x="332" y="362" font-size="12" fill="#8b949e" text-anchor="middle">elf 4</text>
    <rect x="384" y="260.8" width="48" height="77.2" rx="3" fill="#58a6ff" opacity="0.35"/>
    <text x="408" y="252.8" font-size="13" fill="#e6edf3" text-anchor="middle">10000</text>
    <text x="408" y="362" font-size="12" fill="#8b949e" text-anchor="middle">elf 5</text>
    <text x="478" y="215" font-size="13" fill="#8b949e" text-anchor="middle">sort</text>
    <text x="478" y="238" font-size="13" fill="#8b949e" text-anchor="middle">↓ desc</text>
    <line x1="468" y1="248" x2="510" y2="248" stroke="#8b949e" stroke-width="1"/>
    <path d="M510 248 l-8 -5 v10 z" fill="#8b949e"/>
    <text x="540" y="108" font-size="13" fill="#8b949e">sorted totals</text>
    <rect x="600" y="130" width="260.0" height="24" rx="4" fill="#f2cc60" opacity="0.85"/>
    <text x="590" y="147" font-size="13" fill="#8b949e" text-anchor="end">#1</text>
    <text x="868.0" y="147" font-size="13" fill="#e6edf3">24000</text>
    <rect x="600" y="170" width="119.2" height="24" rx="4" fill="#58a6ff" opacity="0.85"/>
    <text x="590" y="187" font-size="13" fill="#8b949e" text-anchor="end">#2</text>
    <text x="727.2" y="187" font-size="13" fill="#e6edf3">11000</text>
    <rect x="600" y="210" width="108.3" height="24" rx="4" fill="#58a6ff" opacity="0.85"/>
    <text x="590" y="227" font-size="13" fill="#8b949e" text-anchor="end">#3</text>
    <text x="716.3" y="227" font-size="13" fill="#e6edf3">10000</text>
    <rect x="600" y="250" width="65.0" height="24" rx="4" fill="#8b949e" opacity="0.5"/>
    <text x="590" y="267" font-size="13" fill="#8b949e" text-anchor="end">#4</text>
    <text x="673.0" y="267" font-size="13" fill="#e6edf3">6000</text>
    <rect x="600" y="290" width="43.3" height="24" rx="4" fill="#8b949e" opacity="0.5"/>
    <text x="590" y="307" font-size="13" fill="#8b949e" text-anchor="end">#5</text>
    <text x="651.3" y="307" font-size="13" fill="#e6edf3">4000</text>
    <line x1="540" y1="130" x2="540" y2="234" stroke="#58a6ff" stroke-width="2"/>
    <line x1="540" y1="130" x2="548" y2="130" stroke="#58a6ff" stroke-width="2"/>
    <line x1="540" y1="234" x2="548" y2="234" stroke="#58a6ff" stroke-width="2"/>
    <text x="540" y="360" font-size="14" fill="#f2cc60">P1 = data[0]</text>
    <text x="540" y="384" font-size="14" fill="#58a6ff">P2 = sum(data[0:3]) = 24000 + 11000 + 10000</text>
    <text x="530" y="186" font-size="12" fill="#58a6ff" text-anchor="end">top 3</text>
  </g>
</svg>
