<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" role="img" aria-labelledby="t d">
  <title id="t">Part 1 push: a line of boxes moves by filling the free cell</title>
  <desc id="d">Moving right from #.@OO..#: the cells up to the first free cell become boxes, then the robot overwrites the first box, giving #..@OO.#. If a wall comes first, nothing moves.</desc>
