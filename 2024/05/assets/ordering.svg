    <text x="40" y="70" font-size="14" fill="#8b949e">rules are stored as a map from a page to the set of pages that must come after it</text>
    <text x="40" y="96" font-size="13" fill="#8b949e">row k = earlier page · column j = later page · cell = is there a rule &quot;row|column&quot;?</text>
