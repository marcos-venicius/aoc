<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d">
  <title id="t">Checking and fixing page orders from the example</title>
  <desc id="d">For an update to be valid, every earlier page must have a rule saying it comes before every later page. Invalid updates are fixed by repeatedly swapping the first bad pair: 97,13,75,29,47 becomes 97,75,47,29,13 after four swaps.</desc>
