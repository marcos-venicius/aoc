<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d">
  <title id="t">How the Zig tokenizer and parser read part of the example</title>
  <desc id="d">The Zig version first turns the text into tokens (Mul, parentheses, Comma, Number and Any for everything else), then tries to match the sequence Mul ( Number , Number ) at each position, skipping a token whenever the match fails.</desc>
  <rect x="1" y="1" width="958" height="328" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="44" font-size="18" font-weight="700" fill="#e6edf3">Zig · tokenizer + tiny parser instead of a regex</text>
    <text x="40" y="70" font-size="14" fill="#8b949e">part 1 only · every failed match advances the cursor and the parser tries again</text>
    <text x="40" y="106" font-size="13" fill="#8b949e">tokens for  +mul(32,64]then(mul(11,8)</text>
    <rect x="40" y="120" width="34" height="34" rx="5" fill="#161b22" stroke="#8b949e" stroke-width="1.2"/>
    <text x="57.0" y="142" font-size="14" fill="#8b949e" text-anchor="middle" font-weight="700">+</text>
    <text x="57.0" y="170" font-size="10" fill="#8b949e" text-anchor="middle">Any</text>
    <rect x="80" y="120" width="50" height="34" rx="5" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/>
    <text x="105.0" y="142" font-size="14" fill="#58a6ff" text-anchor="middle" font-weight="700">mul</text>
    <text x="105.0" y="170" font-size="10" fill="#8b949e" text-anchor="middle">Mul</text>
    <rect x="136" y="120" width="34" height="34" rx="5" fill="#161b22" stroke="#e6edf3" stroke-width="1.2"/>
    <text x="153.0" y="142" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="700">(</text>
    <text x="153.0" y="170" font-size="10" fill="#8b949e" text-anchor="middle">Open</text>
    <rect x="176" y="120" width="40" height="34" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="1.2"/>
    <text x="196.0" y="142" font-size="14" fill="#3fb950" text-anchor="middle" font-weight="700">32</text>
    <text x="196.0" y="170" font-size="10" fill="#8b949e" text-anchor="middle">Num</text>
    <rect x="222" y="120" width="34" height="34" rx="5" fill="#161b22" stroke="#e6edf3" stroke-width="1.2"/>
    <text x="239.0" y="142" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="700">,</text>
    <text x="239.0" y="170" font-size="10" fill="#8b949e" text-anchor="middle">Comma</text>
    <rect x="262" y="120" width="40" height="34" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="1.2"/>
    <text x="282.0" y="142" font-size="14" fill="#3fb950" text-anchor="middle" font-weight="700">64</text>
    <text x="282.0" y="170" font-size="10" fill="#8b949e" text-anchor="middle">Num</text>
    <rect x="308" y="120" width="34" height="34" rx="5" fill="#161b22" stroke="#8b949e" stroke-width="1.2"/>
    <text x="325.0" y="142" font-size="14" fill="#8b949e" text-anchor="middle" font-weight="700">]</text>
    <text x="325.0" y="170" font-size="10" fill="#8b949e" text-anchor="middle">Any</text>
    <rect x="348" y="120" width="60" height="34" rx="5" fill="#161b22" stroke="#8b949e" stroke-width="1.2"/>
    <text x="378.0" y="142" font-size="14" fill="#8b949e" text-anchor="middle" font-weight="700">then</text>
    <text x="378.0" y="170" font-size="10" fill="#8b949e" text-anchor="middle">Any</text>
    <rect x="414" y="120" width="34" height="34" rx="5" fill="#161b22" stroke="#e6edf3" stroke-width="1.2"/>
    <text x="431.0" y="142" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="700">(</text>
    <text x="431.0" y="170" font-size="10" fill="#8b949e" text-anchor="middle">Open</text>
    <rect x="454" y="120" width="50" height="34" rx="5" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/>
    <text x="479.0" y="142" font-size="14" fill="#58a6ff" text-anchor="middle" font-weight="700">mul</text>
    <text x="479.0" y="170" font-size="10" fill="#8b949e" text-anchor="middle">Mul</text>
    <rect x="510" y="120" width="34" height="34" rx="5" fill="#161b22" stroke="#e6edf3" stroke-width="1.2"/>
    <text x="527.0" y="142" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="700">(</text>
    <text x="527.0" y="170" font-size="10" fill="#8b949e" text-anchor="middle">Open</text>
    <rect x="550" y="120" width="40" height="34" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="1.2"/>
    <text x="570.0" y="142" font-size="14" fill="#3fb950" text-anchor="middle" font-weight="700">11</text>
    <text x="570.0" y="170" font-size="10" fill="#8b949e" text-anchor="middle">Num</text>
    <rect x="596" y="120" width="34" height="34" rx="5" fill="#161b22" stroke="#e6edf3" stroke-width="1.2"/>
    <text x="613.0" y="142" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="700">,</text>
    <text x="613.0" y="170" font-size="10" fill="#8b949e" text-anchor="middle">Comma</text>
    <rect x="636" y="120" width="34" height="34" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="1.2"/>
    <text x="653.0" y="142" font-size="14" fill="#3fb950" text-anchor="middle" font-weight="700">8</text>
    <text x="653.0" y="170" font-size="10" fill="#8b949e" text-anchor="middle">Num</text>
    <rect x="676" y="120" width="34" height="34" rx="5" fill="#161b22" stroke="#e6edf3" stroke-width="1.2"/>
    <text x="693.0" y="142" font-size="14" fill="#e6edf3" text-anchor="middle" font-weight="700">)</text>
    <text x="693.0" y="170" font-size="10" fill="#8b949e" text-anchor="middle">Close</text>
    <path d="M80 188 v8 H342 v-8" fill="none" stroke="#ff7b72" stroke-width="1.5"/>
    <text x="80" y="216" font-size="12" fill="#ff7b72">Mul ( Num , Num ] ✗ expected ) → no expression</text>
    <path d="M454 188 v8 H710 v-8" fill="none" stroke="#3fb950" stroke-width="1.5"/>
    <text x="454" y="216" font-size="12" fill="#3fb950">Mul ( Num , Num ) → mul(11,8)</text>
    <text x="40" y="270" font-size="13" fill="#e6edf3">parseExpression() expects exactly:</text>
    <rect x="330" y="250" width="50" height="28" rx="5" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
    <text x="355.0" y="269" font-size="13" fill="#58a6ff" text-anchor="middle">Mul</text>
    <rect x="388" y="250" width="30" height="28" rx="5" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
    <text x="403.0" y="269" font-size="13" fill="#58a6ff" text-anchor="middle">(</text>
    <rect x="426" y="250" width="80" height="28" rx="5" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
    <text x="466.0" y="269" font-size="13" fill="#58a6ff" text-anchor="middle">Number</text>
    <rect x="514" y="250" width="30" height="28" rx="5" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
    <text x="529.0" y="269" font-size="13" fill="#58a6ff" text-anchor="middle">,</text>
    <rect x="552" y="250" width="80" height="28" rx="5" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
    <text x="592.0" y="269" font-size="13" fill="#58a6ff" text-anchor="middle">Number</text>
    <rect x="640" y="250" width="30" height="28" rx="5" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
    <text x="655.0" y="269" font-size="13" fill="#58a6ff" text-anchor="middle">)</text>
    <text x="40" y="304" font-size="13" fill="#8b949e">a word token is a whole run of lowercase letters: the word &quot;mul&quot; is Mul, any other word is Any</text>
  </g>
</svg>
