  <title id="t">The public examples scanned for mul, do() and don't()</title>
  <desc id="d">In part 1 the four well-formed mul instructions add up to 161. In part 2 don't() turns multiplication off until do() turns it back on, so only mul(2,4) and mul(8,5) count, giving 48.</desc>
