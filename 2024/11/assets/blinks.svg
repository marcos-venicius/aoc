<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d">
  <title id="t">The stones 125 and 17 over four blinks</title>
  <desc id="d">Each stone is expanded recursively for the remaining blinks i; leaves at i=0 count as one stone. 125 becomes 3 stones and 17 becomes 6 stones after 4 blinks.</desc>
