<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" role="img" aria-labelledby="t d">
  <title id="t">The six example reports checked for both parts</title>
  <desc id="d">Each level pair shows its difference. Reports 1 and 6 are safe as they are. Reports 4 and 5 become safe once one level is removed; reports 2 and 3 stay unsafe.</desc>
  <rect x="1" y="1" width="958" height="488" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="44" font-size="18" font-weight="700" fill="#e6edf3">Check the steps, then try dropping one level</text>
    <text x="40" y="70" font-size="14" fill="#8b949e">green: step inside 1..3 in the right direction · red: a step that breaks the rule</text>
    <text x="80" y="110" font-size="12" fill="#8b949e" text-anchor="middle">report</text>
    <text x="520" y="110" font-size="12" fill="#8b949e" text-anchor="middle">P1</text>
    <text x="560" y="110" font-size="12" fill="#8b949e">P2 · try removing index 0, 1, 2, …</text>
    <text x="40" y="145" font-size="13" fill="#8b949e">#1</text>
    <rect x="86" y="124" width="44" height="30" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="108.0" y="145" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">7</text>
    <rect x="164" y="124" width="44" height="30" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="186.0" y="145" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">6</text>
    <rect x="242" y="124" width="44" height="30" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="264.0" y="145" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">4</text>
    <rect x="320" y="124" width="44" height="30" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="342.0" y="145" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">2</text>
    <rect x="398" y="124" width="44" height="30" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="420.0" y="145" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">1</text>
    <text x="147.0" y="144" font-size="12" fill="#3fb950" text-anchor="middle">-1</text>
    <text x="225.0" y="144" font-size="12" fill="#3fb950" text-anchor="middle">-2</text>
    <text x="303.0" y="144" font-size="12" fill="#3fb950" text-anchor="middle">-2</text>
    <text x="381.0" y="144" font-size="12" fill="#3fb950" text-anchor="middle">-1</text>
    <text x="520" y="145" font-size="13" fill="#3fb950" text-anchor="middle" font-weight="700">safe</text>
    <text x="560" y="145" font-size="13" fill="#3fb950">already safe</text>
    <text x="40" y="195" font-size="13" fill="#8b949e">#2</text>
    <rect x="86" y="174" width="44" height="30" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="108.0" y="195" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">1</text>
    <rect x="164" y="174" width="44" height="30" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="186.0" y="195" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">2</text>
    <rect x="242" y="174" width="44" height="30" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="264.0" y="195" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">7</text>
    <rect x="320" y="174" width="44" height="30" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="342.0" y="195" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">8</text>
    <rect x="398" y="174" width="44" height="30" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="420.0" y="195" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">9</text>
    <text x="147.0" y="194" font-size="12" fill="#3fb950" text-anchor="middle">+1</text>
    <text x="225.0" y="194" font-size="12" fill="#ff7b72" text-anchor="middle">+5</text>
    <text x="303.0" y="194" font-size="12" fill="#3fb950" text-anchor="middle">+1</text>
    <text x="381.0" y="194" font-size="12" fill="#3fb950" text-anchor="middle">+1</text>
    <text x="520" y="195" font-size="13" fill="#ff7b72" text-anchor="middle" font-weight="700">✗</text>
    <text x="560" y="195" font-size="13" fill="#ff7b72">no removal helps → unsafe</text>
    <text x="40" y="245" font-size="13" fill="#8b949e">#3</text>
    <rect x="86" y="224" width="44" height="30" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="108.0" y="245" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">9</text>
    <rect x="164" y="224" width="44" height="30" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="186.0" y="245" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">7</text>
    <rect x="242" y="224" width="44" height="30" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="264.0" y="245" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">6</text>
    <rect x="320" y="224" width="44" height="30" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="342.0" y="245" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">2</text>
    <rect x="398" y="224" width="44" height="30" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="420.0" y="245" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">1</text>
    <text x="147.0" y="244" font-size="12" fill="#3fb950" text-anchor="middle">-2</text>
    <text x="225.0" y="244" font-size="12" fill="#3fb950" text-anchor="middle">-1</text>
    <text x="303.0" y="244" font-size="12" fill="#ff7b72" text-anchor="middle">-4</text>
    <text x="381.0" y="244" font-size="12" fill="#3fb950" text-anchor="middle">-1</text>
    <text x="520" y="245" font-size="13" fill="#ff7b72" text-anchor="middle" font-weight="700">✗</text>
    <text x="560" y="245" font-size="13" fill="#ff7b72">no removal helps → unsafe</text>
    <text x="40" y="295" font-size="13" fill="#8b949e">#4</text>
    <rect x="86" y="274" width="44" height="30" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="108.0" y="295" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">1</text>
    <rect x="164" y="274" width="44" height="30" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="186.0" y="295" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">3</text>
    <rect x="242" y="274" width="44" height="30" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="264.0" y="295" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">2</text>
    <rect x="320" y="274" width="44" height="30" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="342.0" y="295" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">4</text>
    <rect x="398" y="274" width="44" height="30" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="420.0" y="295" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">5</text>
    <text x="147.0" y="294" font-size="12" fill="#3fb950" text-anchor="middle">+2</text>
    <text x="225.0" y="294" font-size="12" fill="#ff7b72" text-anchor="middle">-1</text>
    <text x="303.0" y="294" font-size="12" fill="#3fb950" text-anchor="middle">+2</text>
    <text x="381.0" y="294" font-size="12" fill="#3fb950" text-anchor="middle">+1</text>
    <text x="520" y="295" font-size="13" fill="#ff7b72" text-anchor="middle" font-weight="700">✗</text>
    <text x="560" y="295" font-size="13" fill="#d2a8ff">drop index 1 → 1 2 4 5 safe</text>
    <text x="40" y="345" font-size="13" fill="#8b949e">#5</text>
    <rect x="86" y="324" width="44" height="30" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="108.0" y="345" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">8</text>
    <rect x="164" y="324" width="44" height="30" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="186.0" y="345" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">6</text>
    <rect x="242" y="324" width="44" height="30" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="264.0" y="345" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">4</text>
    <rect x="320" y="324" width="44" height="30" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="342.0" y="345" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">4</text>
    <rect x="398" y="324" width="44" height="30" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="420.0" y="345" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">1</text>
    <text x="147.0" y="344" font-size="12" fill="#3fb950" text-anchor="middle">-2</text>
    <text x="225.0" y="344" font-size="12" fill="#3fb950" text-anchor="middle">-2</text>
    <text x="303.0" y="344" font-size="12" fill="#ff7b72" text-anchor="middle">+0</text>
    <text x="381.0" y="344" font-size="12" fill="#3fb950" text-anchor="middle">-3</text>
    <text x="520" y="345" font-size="13" fill="#ff7b72" text-anchor="middle" font-weight="700">✗</text>
    <text x="560" y="345" font-size="13" fill="#d2a8ff">drop index 2 → 8 6 4 1 safe</text>
    <text x="40" y="395" font-size="13" fill="#8b949e">#6</text>
    <rect x="86" y="374" width="44" height="30" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="108.0" y="395" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">1</text>
    <rect x="164" y="374" width="44" height="30" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="186.0" y="395" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">3</text>
    <rect x="242" y="374" width="44" height="30" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="264.0" y="395" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">6</text>
    <rect x="320" y="374" width="44" height="30" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="342.0" y="395" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">7</text>
    <rect x="398" y="374" width="44" height="30" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="420.0" y="395" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="700">9</text>
    <text x="147.0" y="394" font-size="12" fill="#3fb950" text-anchor="middle">+2</text>
    <text x="225.0" y="394" font-size="12" fill="#3fb950" text-anchor="middle">+3</text>
    <text x="303.0" y="394" font-size="12" fill="#3fb950" text-anchor="middle">+1</text>
    <text x="381.0" y="394" font-size="12" fill="#3fb950" text-anchor="middle">+2</text>
    <text x="520" y="395" font-size="13" fill="#3fb950" text-anchor="middle" font-weight="700">safe</text>
    <text x="560" y="395" font-size="13" fill="#3fb950">already safe</text>
    <text x="40" y="440" font-size="13" fill="#8b949e">a report is safe when the first step fixes the direction and every step moves 1 to 3 in that direction</text>
    <text x="40" y="464" font-size="14" fill="#f2cc60" font-weight="700">part 1: 2 safe reports  ·  part 2: 4 safe reports</text>
  </g>
</svg>
