  <title id="t">Gamma and epsilon rates from the example diagnostic report</title>
  <desc id="d">Twelve 5-bit numbers. Counting the ones in each column gives 7, 5, 8, 7, 5. The most common bit per column forms gamma 10110 (22) and the least common forms epsilon 01001 (9).</desc>
