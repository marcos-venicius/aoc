  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="44" font-size="18" font-weight="700" fill="#e6edf3">Count the steps where the value goes up</text>
    <text x="40" y="70" font-size="14" fill="#8b949e">part 1 on single depths · part 2 on sums of 3-wide sliding windows</text>
    <g font-size="13" fill="#8b949e" text-anchor="end">
      <text x="120" y="126">depth</text>
      <text x="120" y="276">window</text>
    </g>
    <!-- windows a and b of the first step -->
    <path d="M136 186 V196 H340 V186" fill="none" stroke="#d2a8ff" stroke-width="2"/>
    <path d="M208 204 V214 H412 V204" fill="none" stroke="#f2cc60" stroke-width="2"/>
    <text x="350" y="198" font-size="12" fill="#d2a8ff">a</text>
