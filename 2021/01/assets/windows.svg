<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">Depth increases on the example sonar sweep</title>
  <desc id="d">Ten depths 199, 200, 208, 210, 200, 207, 240, 269, 260, 263 have 7 increases between neighbours. Their three-measurement window sums 607, 618, 618, 617, 647, 716, 769, 792 have 5 increases. Two neighbouring windows share their middle two values, which the code computes once as m.</desc>
