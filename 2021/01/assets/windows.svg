    <line x1="40" y1="340" x2="920" y2="340" stroke="#21262d"/>
    <text x="40" y="368" font-size="14" fill="#e6edf3">m = d[i+1] + d[i+2] (dashed, shared) · a = d[i] + m · b = m + d[i+3]</text>
    <text x="40" y="394" font-size="14" fill="#8b949e">m is computed once per step, and the step counts when b &gt; a</text>
