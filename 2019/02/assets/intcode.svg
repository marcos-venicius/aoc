<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d">
  <title id="t">Running the example Intcode program 1,9,10,3,2,3,11,0,99,30,40,50</title>
  <desc id="d">Step 1 at address 0 adds memory 9 and 10, 30 plus 40, and stores 70 in address 3. Step 2 at address 4 multiplies memory 3 and 11, 70 times 50, and stores 3500 in address 0. At address 8 the opcode 99 halts.</desc>
  <rect x="1" y="1" width="958" height="428" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="44" font-size="18" font-weight="700" fill="#e6edf3">Memory after each instruction (4 cells: op, a, b, out)</text>
    <text x="40" y="70" font-size="14" fill="#8b949e"><tspan fill="#58a6ff">opcode</tspan> · <tspan fill="#3fb950">operands read</tspan> · <tspan fill="#f2cc60">cell written</tspan> · <tspan fill="#ff7b72">99 = halt</tspan></text>

    <!-- addresses -->
    <g font-size="11" fill="#8b949e" text-anchor="middle">
      <text x="190" y="104">0</text><text x="250" y="104">1</text><text x="310" y="104">2</text><text x="370" y="104">3</text>
      <text x="430" y="104">4</text><text x="490" y="104">5</text><text x="550" y="104">6</text><text x="610" y="104">7</text>
      <text x="670" y="104">8</text><text x="730" y="104">9</text><text x="790" y="104">10</text><text x="850" y="104">11</text>
    </g>

    <g font-size="13" fill="#8b949e">
      <text x="40" y="140">start</text>
      <text x="40" y="236">step 1</text>
      <text x="40" y="332">step 2</text>
    </g>

    <!-- row 0 -->
    <g stroke-width="2" fill="#161b22" stroke="#30363d">
      <rect x="162" y="114" width="56" height="40" rx="6" stroke="#58a6ff"/><rect x="222" y="114" width="56" height="40" rx="6"/><rect x="282" y="114" width="56" height="40" rx="6"/><rect x="342" y="114" width="56" height="40" rx="6"/>
      <rect x="402" y="114" width="56" height="40" rx="6"/><rect x="462" y="114" width="56" height="40" rx="6"/><rect x="522" y="114" width="56" height="40" rx="6"/><rect x="582" y="114" width="56" height="40" rx="6"/>
      <rect x="642" y="114" width="56" height="40" rx="6"/><rect x="702" y="114" width="56" height="40" rx="6" stroke="#3fb950"/><rect x="762" y="114" width="56" height="40" rx="6" stroke="#3fb950"/><rect x="822" y="114" width="56" height="40" rx="6"/>
    </g>
    <g font-size="18" fill="#e6edf3" text-anchor="middle">
      <text x="190" y="140" fill="#58a6ff">1</text><text x="250" y="140">9</text><text x="310" y="140">10</text><text x="370" y="140">3</text>
      <text x="430" y="140">2</text><text x="490" y="140">3</text><text x="550" y="140">11</text><text x="610" y="140">0</text>
      <text x="670" y="140">99</text><text x="730" y="140" fill="#3fb950">30</text><text x="790" y="140" fill="#3fb950">40</text><text x="850" y="140">50</text>
    </g>
    <text x="160" y="180" font-size="13" fill="#8b949e">op 1 (add): mem[9] + mem[10] = 30 + 40 = <tspan fill="#f2cc60">70</tspan> → mem[3]</text>

    <!-- row 1 -->
    <g stroke-width="2" fill="#161b22" stroke="#30363d">
      <rect x="162" y="210" width="56" height="40" rx="6"/><rect x="222" y="210" width="56" height="40" rx="6"/><rect x="282" y="210" width="56" height="40" rx="6"/><rect x="342" y="210" width="56" height="40" rx="6" stroke="#f2cc60" fill="#f2cc60" fill-opacity="0.15"/>
      <rect x="402" y="210" width="56" height="40" rx="6" stroke="#58a6ff"/><rect x="462" y="210" width="56" height="40" rx="6"/><rect x="522" y="210" width="56" height="40" rx="6"/><rect x="582" y="210" width="56" height="40" rx="6"/>
      <rect x="642" y="210" width="56" height="40" rx="6"/><rect x="702" y="210" width="56" height="40" rx="6"/><rect x="762" y="210" width="56" height="40" rx="6"/><rect x="822" y="210" width="56" height="40" rx="6" stroke="#3fb950"/>
    </g>
    <g font-size="18" fill="#e6edf3" text-anchor="middle">
      <text x="190" y="236">1</text><text x="250" y="236">9</text><text x="310" y="236">10</text><text x="370" y="236" fill="#f2cc60">70</text>
      <text x="430" y="236" fill="#58a6ff">2</text><text x="490" y="236">3</text><text x="550" y="236">11</text><text x="610" y="236">0</text>
      <text x="670" y="236">99</text><text x="730" y="236">30</text><text x="790" y="236">40</text><text x="850" y="236" fill="#3fb950">50</text>
    </g>
    <text x="160" y="276" font-size="13" fill="#8b949e">op 2 (multiply): mem[3] × mem[11] = 70 × 50 = <tspan fill="#f2cc60">3500</tspan> → mem[0]</text>

    <!-- row 2 -->
    <g stroke-width="2" fill="#161b22" stroke="#30363d">
      <rect x="162" y="306" width="56" height="40" rx="6" stroke="#f2cc60" fill="#f2cc60" fill-opacity="0.15"/><rect x="222" y="306" width="56" height="40" rx="6"/><rect x="282" y="306" width="56" height="40" rx="6"/><rect x="342" y="306" width="56" height="40" rx="6"/>
      <rect x="402" y="306" width="56" height="40" rx="6"/><rect x="462" y="306" width="56" height="40" rx="6"/><rect x="522" y="306" width="56" height="40" rx="6"/><rect x="582" y="306" width="56" height="40" rx="6"/>
      <rect x="642" y="306" width="56" height="40" rx="6" stroke="#ff7b72"/><rect x="702" y="306" width="56" height="40" rx="6"/><rect x="762" y="306" width="56" height="40" rx="6"/><rect x="822" y="306" width="56" height="40" rx="6"/>
    </g>
    <g font-size="18" fill="#e6edf3" text-anchor="middle">
      <text x="190" y="332" fill="#f2cc60">3500</text><text x="250" y="332">9</text><text x="310" y="332">10</text><text x="370" y="332">70</text>
      <text x="430" y="332">2</text><text x="490" y="332">3</text><text x="550" y="332">11</text><text x="610" y="332">0</text>
      <text x="670" y="332" fill="#ff7b72">99</text><text x="730" y="332">30</text><text x="790" y="332">40</text><text x="850" y="332">50</text>
    </g>
    <text x="160" y="372" font-size="13" fill="#8b949e">op 99 at address 8: halt · the answer is <tspan fill="#f2cc60">mem[0]</tspan></text>

    <line x1="40" y1="390" x2="920" y2="390" stroke="#21262d"/>
    <text x="40" y="414" font-size="13" fill="#d2a8ff">part 2: for noun, verb in 0..99: run a fresh copy with mem[1]=noun, mem[2]=verb until mem[0] = 19690720</text>
  </g>
</svg>
