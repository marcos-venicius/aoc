<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d">
  <title id="t">Fuel for a module of mass 1969</title>
  <desc id="d">Mass 1969 needs 654 fuel. That fuel needs 216, which needs 70, then 21, then 5. The next step would be negative, so it stops. Part 1 counts only 654, part 2 adds the whole chain: 966.</desc>
  <rect x="1" y="1" width="958" height="328" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="44" font-size="18" font-weight="700" fill="#e6edf3">fuel(m) = m // 3 − 2, applied again to the fuel itself</text>
    <text x="40" y="70" font-size="14" fill="#8b949e">example module of mass 1969 · the loop stops as soon as the result is ≤ 0</text>

    <g stroke-width="2">
      <rect x="40" y="110" width="100" height="56" rx="8" fill="#161b22" stroke="#30363d"/>
      <rect x="190" y="110" width="100" height="56" rx="8" fill="#3fb950" fill-opacity="0.15" stroke="#3fb950"/>
      <rect x="340" y="110" width="100" height="56" rx="8" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff"/>
      <rect x="490" y="110" width="100" height="56" rx="8" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff"/>
      <rect x="640" y="110" width="100" height="56" rx="8" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff"/>
      <rect x="790" y="110" width="100" height="56" rx="8" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff"/>
    </g>
    <g font-size="22" text-anchor="middle">
      <text x="90" y="146" fill="#e6edf3">1969</text>
      <text x="240" y="146" fill="#3fb950">654</text>
      <text x="390" y="146" fill="#58a6ff">216</text>
      <text x="540" y="146" fill="#58a6ff">70</text>
      <text x="690" y="146" fill="#58a6ff">21</text>
      <text x="840" y="146" fill="#58a6ff">5</text>
    </g>
    <g font-size="12" fill="#8b949e" text-anchor="middle">
      <text x="90" y="186">mass</text>
      <text x="240" y="186">fuel</text>
      <text x="390" y="186">fuel for fuel</text>
      <text x="840" y="186">5 // 3 − 2 = −1 → stop</text>
    </g>
    <g stroke="#8b949e" stroke-width="2" fill="none">
      <path d="M142 138 H184 M178 132 L184 138 L178 144"/>
      <path d="M292 138 H334 M328 132 L334 138 L328 144"/>
      <path d="M442 138 H484 M478 132 L484 138 L478 144"/>
      <path d="M592 138 H634 M628 132 L634 138 L628 144"/>
      <path d="M742 138 H784 M778 132 L784 138 L778 144"/>
    </g>

    <!-- brackets -->
    <path d="M190 212 V222 H290 V212" fill="none" stroke="#3fb950" stroke-width="2"/>
    <text x="240" y="246" font-size="15" fill="#3fb950" text-anchor="middle">part 1: 654</text>
    <path d="M190 268 V278 H890 V268" fill="none" stroke="#f2cc60" stroke-width="2"/>
    <text x="540" y="304" font-size="15" fill="#f2cc60" text-anchor="middle">part 2: 654 + 216 + 70 + 21 + 5 = 966</text>
  </g>
</svg>
